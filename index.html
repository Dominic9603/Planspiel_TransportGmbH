function austriaMap(pins){

  const R=[['Industrie','Linz/Steyr',14.1,48.42],['Tourismus','Tirol/Salzburg',11.0,46.98],['Landwirtschaft','Waldviertel',15.0,48.86],['Großstadt','Wien',16.4,48.34],['Tourismus','Kärnten',13.9,46.72]];

  for(const [t,n,lo,la] of R){const [x,y]=prj([lo,la]);g+=`<text class="rl" x="${x}" y="${y}" text-anchor="middle">${t}</text>`}

function flowsOf(r){
  const c=r.cost,w=c.wage+c.sonder+c.ot,sv=w*.212,flaf=w*.037,komm=w*.03,staatRest=Math.max(0,c.lnk-sv-flaf-komm),oil=(r.liters||0)*.55;
  const out=[['Beschäftigte (private Haushalte)','Bruttolöhne',w],['Sozialversicherung','Pensionen, Kranken- und Arbeitslosenversicherung',sv],['Staat','Familienlastenausgleichsfonds, Mineralölsteuer und CO₂-Preis im Diesel, Maut, weitere Abgaben',flaf+staatRest+oil+c.maut+(r.tax||0)],['Gemeinde','Kommunalsteuer',komm],['Andere Unternehmen','Leasing, Versicherung, Werkstatt, Treibstoff, Miete, Büro, Werbung',c.lease+c.ins+c.maint+c.repair+c.fuel-oil+c.rent+c.admin+c.marketing+c.other+c.penalty+c.spesen],['Bank','Zinsen',c.interest]];
  const inc=[['Unternehmen (Aufträge)','',r.rev.contracts],['Private Haushalte (freier Markt)','',r.rev.spot],['Staat (Förderungen)','',r.subsidy]];
  return{out,inc,komm,flaf,sv,oil}
}
function flowsHtml(r){const f=flowsOf(r),mx=Math.max(1,...f.out.map(x=>x[2]),...f.inc.map(x=>x[2]));
  const row=(x,inn)=>`<span>${x[0]}${x[1]?`<br><span class="sub" style="font-size:11.5px">${x[1]}</span>`:''}</span><span><span class="bar ${inn?'in':''}" style="display:block;width:${Math.max(1,x[2]/mx*100)}%"></span></span><b>${eur(x[2])}</b>`;
  return`<p class="sub"><b>Einnahmen von:</b></p><div class="flow">${f.inc.filter(x=>x[2]>0).map(x=>row(x,1)).join('')}</div><p class="sub" style="margin-top:6px"><b>Ausgaben an:</b></p><div class="flow">${f.out.filter(x=>x[2]>0.5).map(x=>row(x,0)).join('')}</div>`}

  const loanDebt=S.loans.reduce((a,l)=>a+l.left,0);r.cost.interest=loanDebt*LOAN_RATE/12+(S.cash<0?-S.cash*(OD_RATE+(S.rateAdj||0))/12:0);
  for(const o of S.oneoff){if(o.cat==='purchase')r.purchases+=o.amount;else if(o.cat==='sale')r.sales+=o.amount;else if(o.cat==='subsidy')r.subsidy+=o.amount;else if(o.cat==='loanIn')r.loanIn+=o.amount;else if(o.cat==='tilg'){}else r.cost[r.cost[o.cat]!=null?o.cat:'other']+=o.amount}
  r.tilg=S.loans.reduce((a,l)=>a+Math.min(l.left,l.rate),0)+S.oneoff.filter(o=>o.cat==='tilg').reduce((a,o)=>a+o.amount,0);
  // Summen
  r.revTotal=r.rev.contracts+r.rev.spot+r.subsidy;
  r.costTotal=Object.values(r.cost).reduce((a,b)=>a+b,0);
  r.profit=r.revTotal-r.costTotal;
  r.cashDelta=r.revTotal-(r.costTotal-r.cost.afa)-r.purchases+r.sales+r.loanIn-r.tilg;
  r.util=r.availDays?Math.min(1,r.usedDays/r.availDays):0;
  r.varCost=r.cost.fuel+r.cost.maut+r.cost.spesen;
  r.db=r.revTotal-r.varCost;
  return r;
}

/* ================= Monat abschließen ================= */
function closeMonth(){
  if(!S||S.ended)return;
  if(S.event&&S.event.choice&&!S.event.chosen){toast('Triff zuerst die Entscheidung auf der Ereigniskarte.');setTab('over');return}
  const r=simulate(false);

  const fr=r.fulfill.length?r.fulfill.reduce((a,f)=>a+f.done/f.need,0)/r.fulfill.length:1;
  const eco=S.veh.length?S.veh.filter(v=>VEH[v.type].eco).length/S.veh.length:0;
  const ruf0=S.ruf;
  r.rufParts=[fr>=.999?['Alle Aufträge vollständig erfüllt',2]:[`Aufträge im Schnitt nur zu ${pct(fr)} erfüllt`,-(1-fr)*25]];
  if(S.marketing>0)r.rufParts.push([`Werbebudget ${eur(S.marketing)}`,Math.min(3,S.marketing/800)]);
  if(eco>=.3)r.rufParts.push(['Umweltfreundliche Flotte (mind. 30 % emissionsfrei)',1]);
  if(S.spotPrice>3.2)r.rufParts.push(['Paketpreis über 3,20 € wirkt teuer',-1]);
  S.ruf+=fr>=.999?2:-(1-fr)*25;S.ruf+=Math.min(3,S.marketing/800);if(eco>=.3)S.ruf+=1;if(S.spotPrice>3.2)S.ruf-=1;
  S.ruf=Math.max(0,Math.min(100,Math.round(S.ruf)));r.ruf0=ruf0;r.ruf=S.ruf;r.fr=fr;
  // Kasse
  const cash0=S.cash;S.cash+=r.cashDelta;r.cash0=cash0;r.cash=S.cash;
  // Kredite tilgen
  for(const l of S.loans){l.left=Math.max(0,l.left-l.rate)}S.loans=S.loans.filter(l=>l.left>0.5);
  // Fahrzeuge altern, Buchwert sinkt
  for(const v of S.veh){v.age++;v.down=0;if(v.own==='buy'){const t=VEH[v.type];v.bw=Math.max(0,v.bw-t.buy/(t.life*12))}}
  // Personal
  for(const d of S.drv){d.sick=0;if(d.train){d.lic=d.train;d.wage=Math.max(d.wage,Math.round(WAGE[d.lic]*S.wageIdx));r.notes.push(`${d.name} hat die Ausbildung bestanden: ${LIC[d.lic]}.`);d.train=0}}
  // Verträge
  for(const c of S.contracts){c.left--;c.lastFr=(r.fulfill.find(f=>f.id===c.id)||{}).done/c.qty}
  const ended=S.contracts.filter(c=>c.left<=0);if(ended.length)r.notes.push(`Ausgelaufen: ${ended.map(c=>c.client).join(', ')}.`);
  S.contracts=S.contracts.filter(c=>c.left>0);
  // Jahresabschluss
  r.tax=0;
  if(mi()===11){const yp=S.history.filter(h=>Math.floor(h.m/12)===Math.floor(S.m/12)).reduce((a,h)=>a+h.profit,0)+r.profit;r.yearProfit=yp;if(yp>0){r.tax=Math.round(yp*KOEST);S.cash-=r.tax;r.cash=S.cash}}
  // Insolvenz
  r.insolv0=S.insolv;if(S.cash<-OD_LIMIT){S.insolv++;r.notes.push(S.insolv>=3?'Das Konto ist zum dritten Mal hintereinander unter dem Überziehungsrahmen. Die Bank kündigt alle Kredite.':`Achtung (${S.insolv}. Mahnung): Dein Konto liegt unter −${num(OD_LIMIT)} €. Liegt es drei Monate hintereinander darunter, ist dein Unternehmen zahlungsunfähig. Verbessere jetzt deine ${T('liq','Liquidität')}: weniger Kosten, mehr Aufträge${adv()?', Kredit oder Fahrzeug verkaufen':', Fahrzeuge zurückgeben'}.`)}else S.insolv=0;
  r.yearNote=S.yearNote||'';r.event={t:S.event&&S.event.t,res:S.event&&S.event.res,id:S.event&&S.event.id};
  if(um()){const f=flowsOf(r),w=r.cost.wage+r.cost.sonder+r.cost.ot;Object.assign(S.rs,{wages:S.rs.wages+w,komm:S.rs.komm+f.komm,flaf:S.rs.flaf+f.flaf,sv:S.rs.sv+f.sv,oil:S.rs.oil+f.oil,tax:S.rs.tax+(r.tax||0),co2:S.rs.co2+(r.liters||0)*2.65,km:S.rs.km+(r.km||0)});
    for(const [k,iv] of Object.entries(S.innov)){if(iv.done)continue;if(S.m-iv.start+1>=INNOV[k].months){iv.done=true;if(k==='drone'){iv.ok=Math.random()<.5;if(iv.ok)S.ruf=Math.min(100,S.ruf+12)}r.notes.push(k==='drone'?(iv.ok?'Innovation: Das Drohnen-Testprojekt war erfolgreich! Ruf +12, Expressaufträge zahlen mehr.':'Innovation: Das Drohnen-Testprojekt ist gescheitert. Die Technik war noch nicht so weit. Auch das gehört zu Innovation.'):`Innovation fertig: ${INNOV[k].name}. ${INNOV[k].eff}`);r.innovDone=k}}}
  const tk=pickTask(r);r.task=tk.q||tk;r.lp=tk.lp||'';S.tasks[S.m]={q:r.task,a:'',lp:r.lp};
  S.history.push(r);lastReport=r;

}
function pickTaskUnter(r){
  const m=r.m,prev=S.history[S.history.length-1],st=site(),L=[];
  const P=(lp,q)=>L.push({lp,q});
  if(m===0)P('3.5',`Warum hast du dich für den Standort ${st.name} entschieden? Nenne zwei Standortfaktoren, die für dich wichtig waren, und einen Nachteil.`);
  if(r.event&&(r.event.id==='anr'||r.event.id==='lehr'||r.event.id==='bus'))P('3.7','Welche Folgen hat die Ansiedlung deines Unternehmens für die Gemeinde? Nenne eine positive und eine negative Folge für die Menschen dort.');
  if(r.event&&(r.event.id==='zins_up'||r.event.id==='zins_down'))P('3.9','Die Zentralbank hat den Leitzins geändert. Wie wirkt sich das auf Unternehmen und auf private Haushalte aus?');
  if(r.event&&r.event.id==='kv')P('3.9','Gewerkschaft und Wirtschaftskammer wollten unterschiedliche Lohnerhöhungen. Erkläre beide Sichtweisen. Warum ist eine Einigung für beide Seiten wichtig?');
  if(r.innovDone)P('3.12',`Du hast die Innovation „${INNOV[r.innovDone].name}“ umgesetzt. Wem nützt sie: deinem Unternehmen, den Kund:innen, der Umwelt? Begründe.`);
  if(m===5||m===10)P('3.10','Diesen Monat waren die Lohnkosten fast doppelt so hoch (13. bzw. 14. Gehalt). Schau unter „Region“ nach: Wie viel Kommunalsteuer und Familienlastenausgleich hast du bezahlt? Was davon nützt dir als Schüler:in?');
  if(st.season==='tour'&&(m%12===3||m%12===9))P('3.6','Deine Region ist eine Tourismusregion. Vergleiche die Zahl deiner Aufträge in der Hochsaison und jetzt. Erkläre den Unterschied.');
  if(prev&&Math.abs(prev.spot.price-r.spot.price)>.05)P('3.8',`Du hast deinen Paketpreis von ${eurC(prev.spot.price)} auf ${eurC(r.spot.price)} geändert. Wie haben Nachfrage und Umsatz reagiert? Erkläre mit Angebot und Nachfrage.`);
  if(r.profit<0)P('3.8','Dein Unternehmen hat Verlust gemacht. Vergleiche deinen Paketpreis mit deinen Kosten pro Paket (unter „Aufträge“). Warum kannst du auf Dauer nicht billiger verkaufen, als es dich kostet?');
  if(r.cash<0)P('3.9','Dein Konto ist im Minus und du zahlst der Bank Zinsen. Welche Rolle spielen Banken in der Wirtschaft?');
  if(m===2||m===8)P('3.6','Schau dir unter „Region“ die Karte an. Ordne deine Kund:innen zu: Welche gehören zu Industrie, Tourismus, Landwirtschaft oder Dienstleistung?');
  if(m===4)P('3.12','Welche Innovation könnte die Paketzustellung in den nächsten zehn Jahren verändern? Beschreibe eine Idee und ihre Folgen für Gesellschaft und Umwelt.');
  if(m===6||m===11)P('3.11','Was braucht ein Unternehmen wie deines von Österreich als Wirtschaftsstandort? Nenne drei Rahmenbedingungen (z. B. Straßen, Fachkräfte, Gesetze).');
  if(r.tax>0)P('3.10',`Du zahlst ${eur(r.tax)} Körperschaftsteuer. Wofür verwendet der Staat Steuern? Nenne drei Beispiele aus deinem Alltag.`);
  P('3.9','Schau unter „Region“, wohin dein Geld geflossen ist. Welche Akteure der Wirtschaft haben von deinem Unternehmen Geld bekommen, und wofür?');
  P('3.7',`Dein Unternehmen ist ${S.rs.km>0?`schon ${num(S.rs.km)} km gefahren und hat rund ${num(S.rs.co2/1000)} t CO₂ ausgestoßen`:'unterwegs'}. Welche ökologischen Folgen hat ein Paketdienst? Wie könntest du sie verringern?`);
  P('3.11','Wie viele Arbeitsplätze hast du geschaffen und wie viel Lohn hast du bisher bezahlt? Warum sind Unternehmen wichtig für eine Region?');
  const recent=Object.values(S.tasks).slice(-4).map(t=>t.q);
  return L.find(x=>!recent.includes(x.q))||L[L.length-1];
}
function pickTask(r){
  if(um())return pickTaskUnter(r);
  const m=r.m%12,prev=S.history[S.history.length-1];
  const L=[];
  if(m===5||m===10)L.push('Warum sind die Lohnkosten diesen Monat fast doppelt so hoch wie sonst? Erkläre den Begriff 13. bzw. 14. Gehalt.');
  if(r.cash<0)L.push('Dein Konto ist im Minus. Erkläre den Unterschied zwischen Gewinn und Liquidität. Was kannst du tun, damit das Konto wieder ins Plus kommt?');
  if(r.profit<0)L.push('Dein Unternehmen hat diesen Monat Verlust gemacht. Nenne zwei Kosten, die du senken könntest, oder zwei Wege, mehr Umsatz zu machen. Begründe kurz.','Schau in deine Abrechnung: Welche drei Ausgaben waren diesen Monat am größten? Welche davon sind Fixkosten, welche variable Kosten?','Was müsste sich ändern, damit du im nächsten Monat Gewinn machst? Rechne grob nach.');
  if(r.fulfill.some(f=>f.done<f.need))L.push('Du konntest nicht alle Aufträge erfüllen. Welche Folgen hat das für dein Unternehmen? Was würdest du nächsten Monat anders machen?');
  if(r.purchases>0&&adv())L.push('Du hast ein Fahrzeug gekauft. Warum erscheint der Kaufpreis nicht vollständig als Kosten in der Erfolgsrechnung dieses Monats?');
  if(prev&&Math.abs(prev.spot.price-r.spot.price)>.05)L.push(`Du hast den Preis am freien Markt von ${eurC(prev.spot.price)} auf ${eurC(r.spot.price)} geändert. Wie haben sich Nachfrage und Umsatz verändert? Erkläre den Zusammenhang.`);
  if(r.util<.6&&r.pairs>0)L.push('Deine Fahrzeuge waren nur wenig ausgelastet. Warum ist eine geringe Auslastung für ein Unternehmen teuer?');
  if(r.tax>0)L.push(`Du zahlst ${eur(r.tax)} Körperschaftsteuer. Wofür verwendet der Staat Steuern? Nenne zwei Beispiele.`);
  if(r.event&&r.event.t&&r.m>0)L.push(`Ereignis des Monats: „${r.event.t}“. Wie hat sich das auf dein Unternehmen ausgewirkt?`);
  L.push('Was war deine wichtigste Entscheidung in diesem Monat und warum hast du sie so getroffen?','Nenne drei Fixkosten deines Unternehmens und erkläre, warum sie auch dann anfallen, wenn ein Fahrzeug stillsteht.','Wie hat sich dein Kontostand seit dem Start verändert? Erkläre, woran das liegt.','Was würdest du einer Freundin oder einem Freund raten, die bzw. der einen Paketdienst gründen will?','Leasen oder kaufen: Was spricht für das eine, was für das andere?');
  const recent=Object.values(S.tasks).slice(-4).map(t=>t.q);
  return L.find(q=>!recent.includes(q))||L[L.length-1];
}

function estDB(c){

    if(last){const yrev=year.reduce((a,x)=>a+x.revTotal,0),yp=year.reduce((a,x)=>a+x.profit,0),fixAvg=year.reduce((a,x)=>a+(x.costTotal-x.varCost),0)/year.length,dbq=yrev?year.reduce((a,x)=>a+x.db,0)/yrev:0;
      kpi=`<div class="panel"><h2>Kennzahlen <small>Jahr bisher</small></h2><div class="tiles">
        <div class="tile"><div class="l">${T('ur','Umsatzrendite')}</div><div class="v">${yrev?pct(yp/yrev):'–'}</div><div class="d">Gewinn ÷ Umsatz</div></div>
        <div class="tile"><div class="l">${T('ekq','Eigenkapitalquote')}</div><div class="v">${b.assets>0?pct(Math.max(0,b.ek)/b.assets):'–'}</div><div class="d">Eigenkapital ÷ Gesamtkapital</div></div>
        <div class="tile"><div class="l">${T('be','Break-even')}-Umsatz</div><div class="v">${dbq>0?eur(fixAvg/dbq):'–'}</div><div class="d">pro Monat, bei gleicher Kostenstruktur</div></div>
        <div class="tile"><div class="l">${T('liq','Liquidität')}</div><div class="v ${S.cash<0?'neg':''}">${eur(S.cash+OD_LIMIT)}</div><div class="d">verfügbar inkl. Überziehungsrahmen</div></div></div></div>`}
  }else{
    loan=`<div class="panel"><h2>Bank</h2><p class="sub">Wenn dein Konto ins Minus rutscht, überzieht die Bank bis −15.000 €. Dafür zahlst du 11 % ${T('zinsen','Zinsen')} pro Jahr. Liegt dein Konto drei Monate hintereinander darunter, bist du zahlungsunfähig (${T('insolvenz','Insolvenz')}).</p></div>`;
  }
  return kpi+guv+bil+loan;
}

/* ================= Diagramme ================= */
function nice(max){const p=Math.pow(10,Math.floor(Math.log10(max||1))),m=max/p;return(m<=1?1:m<=2?2:m<=5?5:10)*p}
function barChart(vals,labels){
  const W=600,H=220,L=58,R=10,Tp=12,B=26,n=vals.length,mx=Math.max(1,...vals.map(Math.abs));
  const hi=Math.max(0,...vals),lo=Math.min(0,...vals),step=nice((hi-lo||1)/4),top=Math.ceil(hi/step)*step||step,bot=Math.floor(lo/step)*step;
  const y=v=>Tp+(top-v)/(top-bot)*(H-Tp-B),bw=Math.min(36,(W-L-R)/n*.62),x=i=>L+(i+.5)*(W-L-R)/n;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ergebnis je Monat">`;
  for(let v=bot;v<=top+1e-6;v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v===0?1.5:1}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${num(v/1000)}k</text>`;
  vals.forEach((v,i)=>{const y0=y(0),y1=y(v),hgt=Math.max(1,Math.abs(y1-y0));s+=`<rect x="${x(i)-bw/2}" y="${Math.min(y0,y1)}" width="${bw}" height="${hgt}" rx="3" fill="${v<0?'var(--bad)':'var(--good)'}" data-tip="${labels[i]}: ${eur(v)}"/><text x="${x(i)}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`});
  return s+'</svg>';
}
function lineChart(vals,labels){
  const W=600,H=220,L=58,R=14,Tp=12,B=26,n=vals.length;
  const hi=Math.max(0,...vals),lo=Math.min(0,...vals),step=nice((hi-lo||1)/4),top=Math.ceil(hi/step)*step||step,bot=Math.floor(lo/step)*step;
  const y=v=>Tp+(top-v)/(top-bot)*(H-Tp-B),x=i=>L+(n>1?i/(n-1):.5)*(W-L-R);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kontostand je Monat">`;
  for(let v=bot;v<=top+1e-6;v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v===0?1.5:1}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${num(v/1000)}k</text>`;
  if(bot<=-OD_LIMIT)s+=`<line x1="${L}" x2="${W-R}" y1="${y(-OD_LIMIT)}" y2="${y(-OD_LIMIT)}" stroke="var(--bad)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W-R}" y="${y(-OD_LIMIT)-5}" text-anchor="end">Überziehungsgrenze</text>`;
  s+=`<polyline fill="none" stroke="var(--info)" stroke-width="2" points="${vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}"/>`;
  vals.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===n-1?5:3.5}" fill="${v<0?'var(--bad)':'var(--info)'}" stroke="var(--card)" stroke-width="2"/><circle cx="${x(i)}" cy="${y(v)}" r="14" fill="transparent" data-tip="${labels[i]}: ${eur(v)}"/>`;if(n<=13||i%2===0)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`});
  return s+'</svg>';
}

/* ================= Aktionen ================= */
function act(k,arg,el){
  const t=VEH[arg];
  switch(k){
    case'accept':{const c=S.offers.find(o=>o.id===+arg);if(!c)return;S.offers=S.offers.filter(o=>o!==c);c.left=c.months;c.from=S.m;S.contracts.push(c);toast(`Vertrag mit ${c.client} abgeschlossen.`);break}
    case'lease':{if(S.veh.length>=(S.depotBig?16:8))return;S.veh.push(mkVeh(arg,'lease'));if(t.eco&&S.ecoBonus===S.m)addOne(`Förderung ${t.name}`,2000,'subsidy');toast(`${t.name} geleast.`);break}
    case'buy':{if(S.veh.length>=(S.depotBig?16:8))return;const after=S.cash+simulate(true).cashDelta-t.buy;if(after<-OD_LIMIT&&!confirmTwice(el,'Konto rutscht unter das Limit! Trotzdem kaufen?'))return;S.veh.push(mkVeh(arg,'buy'));addOne(`Kauf ${t.name}`,t.buy,'purchase');if(t.eco&&S.ecoBonus===S.m)addOne(`Förderung ${t.name}`,t.buy*.2,'subsidy');toast(`${t.name} gekauft. ${eur(t.buy)} gehen beim Monatsabschluss vom Konto ab.`);break}
    case'ret':{if(!confirmTwice(el,'Wirklich zurückgeben?'))return;const v=S.veh.find(x=>x.id===+arg);if(!v)return;S.veh=S.veh.filter(x=>x!==v);addOne(`Leasing-Rückgabe ${VEH[v.type].name}`,VEH[v.type].lease*(adv()?2:1),'other');toast('Fahrzeug zurückgegeben.');break}
    case'sell':{if(!confirmTwice(el,'Wirklich verkaufen?'))return;const v=S.veh.find(x=>x.id===+arg);if(!v)return;const p=Math.round(v.bw*.85);S.veh=S.veh.filter(x=>x!==v);addOne(`Verkauf ${VEH[v.type].name}`,p,'sale');addOne('Verlust aus Fahrzeugverkauf',v.bw-p,'loss');toast(`Verkauft für ${eur(p)}.`);break}
    case'hire':{const d=S.cands[+arg];if(!d)return;S.cands.splice(+arg,1);S.drv.push(d);addOne(`Stelleninserat ${d.name}`,350,'other');toast(`${d.name} ist jetzt in deinem Team.`);break}
    case'fire':{if(!confirmTwice(el,'Wirklich kündigen?'))return;const d=S.drv.find(x=>x.id===+arg);if(!d)return;S.drv=S.drv.filter(x=>x!==d);addOne(`Kündigungsfrist ${d.name}`,d.wage*(1+LNK),'other');toast(`${d.name} wurde gekündigt.`);break}
    case'train':{const d=S.drv.find(x=>x.id===+arg);if(!d)return;const nx=d.lic+1;d.train=nx;addOne(`Ausbildung ${LIC[nx]} ${d.name}`,TRAIN[nx].cost,'other');toast(`${d.name} macht die Ausbildung. Ab nächstem Monat gilt der neue Führerschein.`);break}
    case'depot':{if(!confirmTwice(el,'Wirklich umziehen?'))return;S.depotBig=true;addOne('Umzug in größeres Depot',3000,'other');toast('Ihr zieht in ein größeres Depot.');break}
    case'loan':{const a=+$('loanAmt').value;if(!a)return;S.loans.push({amt:a,left:a,rate:a/36});addOne('Kreditauszahlung',a,'loanIn');toast(`Kredit über ${eur(a)} aufgenommen.`);break}
    case'repay':{if(!confirmTwice(el,'Wirklich alles zurückzahlen?'))return;const d=S.loans.reduce((a,l)=>a+l.left,0);addOne('Sondertilgung Kredit',d,'tilg');S.loans=[];toast('Kredit zurückgezahlt.');break}
    case'innov':{const v=INNOV[arg];if(!v||S.innov[arg])return;const cost=v.cost;addOne(`Innovation: ${v.name}`,cost,'other');if(v.grant)addOne(`Förderung: ${v.name}`,cost*v.grant,'subsidy');S.innov[arg]={start:S.m,done:false};toast(`Projekt gestartet: ${v.name}.`);break}
    case'move':{const x=SITES[arg];if(!x)return;if(!confirmTwice(el,`Wirklich nach ${x.name}?`))return;S.site=arg;addOne(`Umzug nach ${x.name}`,6000,'other');S.contracts.forEach(c=>{if(c.seg==='stadt'&&c.place)c.ek=Math.round(2*distKm(x.place,c.place)*1.3)});S.offers=S.offers.map(o=>genOffer(o.seg));toast(`Dein Depot ist jetzt in ${x.name}.`);break}
    case'saveAnswers':{document.querySelectorAll('[data-answer]').forEach(t=>{const v=t.value.trim();if(v)S.tasks[t.dataset.answer].a=v});toast('Antworten gespeichert.');break}
  }
  save();render();
}
function confirmTwice(el,msg){if(el.dataset.arm&&Date.now()-el.dataset.arm<3500)return true;el.dataset.arm=Date.now();el.dataset.old=el.textContent;el.textContent=msg+' Nochmal tippen';setTimeout(()=>{if(el.isConnected&&el.dataset.old){el.textContent=el.dataset.old;delete el.dataset.arm}},3500);return false}

const COSTLBL={wage:'Löhne',sonder:'13./14. Gehalt',lnk:'Lohnnebenkosten',ot:'Überstunden',fuel:'Treibstoff und Strom',maut:'Maut',spesen:'Spesen',lease:'Leasing',ins:'Versicherung',maint:'Wartung',repair:'Reparaturen',afa:'Abschreibung',rent:'Miete',admin:'Büro und Verwaltung',marketing:'Werbung',interest:'Zinsen',penalty:'Vertragsstrafen',other:'Sonstiges',loss:'Verluste'};
let repArgs=null;
function anaHtml(r){
  if(!r.vd)return'<p class="empty">Für diesen Monat gibt es noch keine Detaildaten. Die ausführliche Analyse gibt es für alle Monate, die ab jetzt abgeschlossen werden.</p>';
  const idx=S.history.indexOf(r),prev=idx>0?S.history[idx-1]:null,U=f=>f.unit==='Pakete'?'Pakete':'Einsatztage';
  const n1=x=>num(Math.round(x));

  const pen=r.fulfill.reduce((a,f)=>a+f.pen,0),miss=r.fulfill.reduce((a,f)=>a+(f.need-f.done)*f.price,0);
  if(pen>0)B.push([pen+miss,`Aufträge nicht vollständig erfüllt: ${eur(pen)} Vertragsstrafe und ${eur(miss)} entgangener Umsatz. Meist heißt das: Du hast mehr Aufträge angenommen, als deine Fahrzeuge schaffen. Die genauen Gründe stehen unten bei jedem Auftrag.`]);
  const lostSpot=Math.max(0,r.spot.demand-r.spot.served);
  if(lostSpot>0)B.push([lostSpot*r.spot.price,`Freier Markt: ${num(lostSpot)} Pakete wollten Kund:innen bei dir aufgeben, aber du hattest keine freie Kapazität. Entgangener Umsatz: ${eur(lostSpot*r.spot.price)}.`]);
  const idleW=(r.idleDrv||[]).reduce((a,d)=>a+d.w*(1+LNK),0);
  if(idleW>0)B.push([idleW,`${r.idleDrv.length} Fahrer:in${r.idleDrv.length>1?'nen':''} ohne Fahrzeug (${r.idleDrv.map(d=>esc(d.n)).join(', ')}). Lohn und Lohnnebenkosten von rund ${eur(idleW)} hast du trotzdem bezahlt.`]);
  const nod=r.vd.filter(v=>!v.d);if(nod.length)B.push([nod.reduce((a,v)=>a+v.fix,0),`${nod.length} Fahrzeug${nod.length>1?'e':''} ohne passende Fahrer:in (${nod.map(v=>`${v.n}, braucht ${LIC[v.lic]}`).join('; ')}). Leasing, Versicherung und Wartung von ${eur(nod.reduce((a,v)=>a+v.fix,0))} liefen trotzdem.`]);
  const low=r.vd.filter(v=>v.d&&v.days>0&&v.used/v.days<.5);
  if(low.length)B.push([low.reduce((a,v)=>a+v.fix*(1-v.used/v.days),0),`Kaum genutzt: ${low.map(v=>`${v.n} (${pct(v.used/v.days)})`).join(', ')}. Ein Fahrzeug kostet auch dann Geld, wenn es steht. Nimm mehr Aufträge an oder gib es zurück.`]);
  if(r.cost.repair>0)B.push([r.cost.repair,`Reparaturen nach Pannen: ${eur(r.cost.repair)}. Ältere Fahrzeuge haben öfter Pannen.`]);
  if(r.cost.ot>0)B.push([r.cost.ot*.33,`Überstunden kosten 50 % Zuschlag: ${eur(r.cost.ot)} zusätzlich. Auf Dauer ist ein weiteres Fahrzeug oft günstiger.`]);
  if(r.cost.interest>0&&r.cash0<0)B.push([r.cost.interest,`Dein Konto war im Minus. Dafür verlangt die Bank ${(r.odRate*100).toLocaleString("de-AT")} % Zinsen pro Jahr: ${eur(r.cost.interest)} in diesem Monat.`]);
  if(r.fulfill.some(f=>f.noPay))B.push([r.fulfill.filter(f=>f.noPay).reduce((a,f)=>a+f.done*f.price,0),`Ein Kunde hat nicht bezahlt (Forderungsausfall). Achte im Expertenmodus auf die Bonität.`]);
  B.sort((a,b)=>b[0]-a[0]);
  const verdict=r.profit<0?`Du hast ${eur(-r.profit)} Verlust gemacht: Den Einnahmen von ${eur(r.revTotal)} standen Kosten von ${eur(r.costTotal)} gegenüber.`:`Du hast ${eur(r.profit)} Gewinn gemacht: Einnahmen ${eur(r.revTotal)}, Kosten ${eur(r.costTotal)}.`;
  const big=Object.entries(r.cost).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${COSTLBL[k]} ${eur(v)}`).join(', ');

  // Aufträge
  if(r.fulfill.length){h+=`<div class="panel"><h2>Aufträge im Detail <small>in der Reihenfolge, in der sie abgearbeitet wurden</small></h2><p class="sub">Aufträge werden in der Reihenfolge abgearbeitet, in der du sie angenommen hast. Frühere Aufträge belegen die Fahrzeuge zuerst, danach kommt der freie Markt.</p>`;
    for(const f of r.fulfill){const segN=SEG[f.seg].name,u=U(f),mis=f.need-f.done;

      if(mis>0){const why=[];
        if(!f.fleet)why.push(`Du hast kein passendes Fahrzeug. Für ${segN} brauchst du: ${SEG[f.seg].veh.map(t=>VEH[t].name).join(' oder ')}.`);
        else if(!f.np)why.push(`Du hast ${f.fleet} passende${f.fleet>1?'':'s'} Fahrzeug${f.fleet>1?'e':''}, aber niemand mit dem nötigen Führerschein war frei. Das Fahrzeug stand still.`);
        else{why.push(`Deine passenden Fahrzeuge hätten diesen Monat zusammen ${n1(f.full)} ${u} geschafft.`);

  if(r.rufParts)h+=`<div class="panel"><h2>Ruf ${r.ruf0} → ${r.ruf}</h2><table class="fin">${r.rufParts.map(([l,v])=>`<tr><td>${l}</td><td class="n ${v<0?'neg':'pos'}">${v>0?'+':v<0?'−':''}${num(Math.abs(Math.round(v*10)/10))}</td></tr>`).join('')}</table><p class="sub">Ereignisse während des Monats (z. B. Bewertungen, Werbekampagne) wirken sofort und sind hier nicht eingerechnet.</p></div>`;

  const oo=(r.oneoffs||[]).filter(o=>o[2]!=='subsidy'&&o[2]!=='loanIn');

  return h;

function teacherSheet(){
  openSheet(`<button class="small x" data-close type="button">Schließen</button><span class="chip info" style="align-self:flex-start">Für Lehrkräfte</span><h2>Hinweise zum Planspiel</h2>
  <p><b>Idee:</b> Die Schülerinnen und Schüler führen einen kleinen Paketdienst in Wien ein Geschäftsjahr lang. Jede Runde ist ein Monat: Sie nehmen Aufträge an, setzen einen Preis, leasen oder kaufen Fahrzeuge, stellen Personal ein und schließen den Monat ab. Danach lesen sie den Monatsbericht und beantworten einen Arbeitsauftrag.</p>
  <p><b>Modi:</b> <i>Unterstufe</i>: ausgerichtet auf den Kompetenzbereich „Entwicklungen am Wirtschaftsstandort Österreich“ (siehe unten). <i>Oberstufe</i>: Einnahmen, Ausgaben, Gewinn, Löhne, Lohnnebenkosten, 13./14. Gehalt, Leasing, Überziehung und Liquidität. <i>Expertenmodus</i> (z. B. HAK, HAS): zusätzlich Kauf mit Abschreibung, Kredit, Erfolgsrechnung, Bilanz, Deckungsbeitrag, Break-even, Bonität, Fernverkehr mit Maut, Kennzahlen.</p>
  <div class="tablewrap"><table class="fin"><tr class="grp"><td>Lehrplan (Unterstufe)</td><td style="text-align:left">Im Spiel</td></tr>
  <tr><td>3.5 Standortfaktoren und Standortentscheidungen</td><td style="text-align:left;white-space:normal">Standortwahl zu Beginn mit harten und weichen Faktoren, späterer Umzug, Ansiedlungsförderung</td></tr>
  <tr><td>3.6 Wirtschaftsregionen charakterisieren und verorten</td><td style="text-align:left;white-space:normal">Österreich-Karte, Kund:innen aus Industrie-, Tourismus-, Agrar- und Stadtregionen, saisonale Schwankungen</td></tr>
  <tr><td>3.7 Folgen einer Ansiedelung</td><td style="text-align:left;white-space:normal">Arbeitsplätze, Kommunalsteuer, CO₂, Ereignisse: Anrainer:innen, Lehrstelle, Buslinie, Fachkräftemangel</td></tr>
  <tr><td>3.8 Preisbildung, Angebot und Nachfrage</td><td style="text-align:left;white-space:normal">Preisvergleich mit Mitbewerbern, Nachfragekurve, Kosten pro Paket</td></tr>
  <tr><td>3.9 Akteure der ökosozialen Marktwirtschaft</td><td style="text-align:left;white-space:normal">Geldflüsse zu Haushalten, Unternehmen, Staat, Gemeinde, Sozialversicherung, Bank; Leitzins (EZB/OeNB); KV-Verhandlung der Sozialpartner</td></tr>
  <tr><td>3.10 Steuern und Abgaben</td><td style="text-align:left;white-space:normal">Kommunalsteuer, Familienlastenausgleichsfonds, Sozialversicherung, Mineralölsteuer und CO₂-Preis, Körperschaftsteuer</td></tr>
  <tr><td>3.11 Bedeutung von Unternehmen für den Standort</td><td style="text-align:left;white-space:normal">„Dein Beitrag für die Region“, Arbeitsaufträge zu Rahmenbedingungen</td></tr>

  <p><b>Diskussionsfragen:</b> Warum macht das Unternehmen trotz voller Auftragsbücher Verlust? Lohnt sich ein E-Fahrzeug? Warum zahlen Unternehmen lieber Leasing als den vollen Kaufpreis? Was passiert, wenn eine Fahrerin krank wird?</p>

   <div class="actions"><button class="primary small" id="copyCode" type="button">Code kopieren</button><button class="small" id="dlCode" type="button" ${DL?'':'hidden'}>Als Datei speichern</button><button class="small" data-act2="final" type="button">Abschlussbericht</button></div>
   <label class="f" for="codeIn">Spielstand laden</label><textarea id="codeIn" class="codebox" placeholder="Sicherungscode hier einfügen"></textarea>
   <div class="actions"><button class="primary small" id="loadCode" type="button">Laden</button><button class="small" data-act2="restart" type="button">Neues Planspiel</button></div><p class="sub" id="ioMsg" aria-live="polite"></p>`);
  $('codeOut').value=code;
  $('copyCode').onclick=()=>copyText(code,$('codeOut'),$('ioMsg'));
  $('dlCode').onclick=async()=>{try{await DL.save({filename:`planspiel-spielstand-${monthName().replace(' ','-')}.txt`,data:code});$('ioMsg').textContent='Datei gespeichert.'}catch(e){$('ioMsg').textContent='Speichern ging nicht. Kopiere stattdessen den Code.'}};
  let pend=null,arm=0;
  $('loadCode').onclick=async()=>{if(pend&&Date.now()-arm<6000){S=pend;tab='over';save();closeSheet();render();toast('Spielstand geladen.');return}
    try{pend=await decodeSave($('codeIn').value);arm=Date.now();$('loadCode').textContent='Wirklich laden? Nochmal tippen';$('ioMsg').textContent=`Gefunden: ${pend.firma}, ${monthName(pend.m)}. Dein aktueller Spielstand wird ersetzt.`}catch(e){$('ioMsg').textContent='Das ist kein gültiger Sicherungscode.'}};
}
async function encodeSave(){const json=JSON.stringify(S);try{if(window.CompressionStream){const st=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));const u=new Uint8Array(await new Response(st).arrayBuffer());let b='';for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return'PSZ1'+btoa(b)}}catch(e){}return'PSJ1'+btoa(unescape(encodeURIComponent(json)))}
async function decodeSave(code){code=(code||'').trim().replace(/\s+/g,'');let json;
  if(code.startsWith('PSZ1')){const bin=atob(code.slice(4)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);json=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
  else if(code.startsWith('PSJ1'))json=decodeURIComponent(escape(atob(code.slice(4))));else throw new Error('format');
  const st=JSON.parse(json);if(!st||st.v!==1||!Array.isArray(st.veh))throw new Error('format');return st}
function startSheet(pre){
  pre=pre||{};$('sheet').dataset.lock='1';
  openSheet(`<span class="chip gold" style="align-self:flex-start">Planspiel</span><h2>Gründe deinen Paketdienst</h2>
   <p>Du übernimmst ein kleines Zustellunternehmen in Wien. Dein Ziel: ein Geschäftsjahr lang wirtschaften, ohne pleitezugehen, und am Ende möglichst viel Gewinn und einen guten Ruf haben.</p>
   <label class="f" for="stName">Dein Name<input type="text" id="stName" autocomplete="name" maxlength="40" value="${esc(pre.name||'')}"></label>
   <label class="f" for="stKl">Klasse<input type="text" id="stKl" maxlength="12" placeholder="z. B. 3B" value="${esc(pre.klasse||'')}"></label>
   <label class="f" for="stFirma">Name deiner Firma<input type="text" id="stFirma" maxlength="40" placeholder="z. B. Blitzpaket GmbH" value="${esc(pre.firma||'')}"></label>
   <div class="lvl" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><label><input type="radio" name="lvl" value="unter" ${!pre.lvl||pre.lvl==='unter'?'checked':''}><div><b>Unterstufe</b><span>Wirtschaftsstandort Österreich: Standortwahl, Regionen, Preise, Akteure, Steuern, Innovation.</span></div></label>
   <label><input type="radio" name="lvl" value="basic" ${pre.lvl==='basic'?'checked':''}><div><b>Oberstufe</b><span>Einnahmen, Ausgaben, Gewinn, Löhne, Lohnnebenkosten, Leasing, Liquidität.</span></div></label>
   <label><input type="radio" name="lvl" value="adv" ${pre.lvl==='adv'?'checked':''}><div><b>Expertenmodus</b><span>Kauf und Abschreibung, Kredit, Erfolgsrechnung, Bilanz, Kennzahlen, Fernverkehr.</span></div></label></div>
   <p class="sub" id="stMsg"></p>
   <div class="actions"><button class="primary" id="stGo" type="button">Planspiel starten</button><button class="small" data-act2="loadFromStart" type="button">Spielstand laden</button><button class="small" data-open="teacher" type="button">Für Lehrkräfte</button></div>`);
  $('stGo').onclick=()=>{const n=$('stName').value.trim(),f=$('stFirma').value.trim()||'Mein Paketdienst GmbH';if(!n){$('stMsg').textContent='Bitte gib deinen Namen ein.';$('stName').focus();return}
    const o={name:n,klasse:$('stKl').value.trim(),firma:f,lvl:document.querySelector('input[name=lvl]:checked').value};
    if(o.lvl==='unter'){siteSheet(o,pre.site);return}
    newGame(o);delete $('sheet').dataset.lock;closeSheet();tab='over';render()};
}
function siteSheet(o,cur){
  $('sheet').dataset.lock='1';
  const SHORT={wien:['Wien',-8,-4,'end'],sued:['Wr. Neudorf',-8,8,'end']};const pins=Object.entries(SITES).map(([k,x])=>{const sh=SHORT[k];return{place:x.place,label:sh?sh[0]:x.name.split(' (')[0],depot:1,dx:sh?sh[1]:8,dy:sh?sh[2]:0,anchor:sh?sh[3]:'start'}});
  openSheet(`<span class="chip gold" style="align-self:flex-start">Standortwahl</span><h2>Wo eröffnest du dein Depot?</h2>
   <p>Jeder Standort hat andere ${T('standort','Standortfaktoren')}. Überlege, was dir wichtig ist: Kund:innen in der Nähe, günstige Miete, Verkehrsanbindung, genug Arbeitskräfte.</p>
   ${austriaMap(pins)}
   <div class="sites">${Object.entries(SITES).map(([k,x])=>`<button class="site" data-site="${k}" type="button" ${k===cur?'style="border-color:var(--accent)"':''}><span class="t">${x.name}</span><span class="chip">${x.label}</span><ul>${x.plus.map(y=>`<li>${y}</li>`).join('')}</ul><ul class="minus">${x.minus.map(y=>`<li>${y}</li>`).join('')}</ul><span class="sub">Miete ${eur(x.rent)} / Monat</span></button>`).join('')}</div>
   <div class="actions"><button class="small" id="siteBack" type="button">Zurück</button></div>`);
  $('siteBack').onclick=()=>startSheet(o);
  $('sheet').querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>{newGame({...o,site:b.dataset.site});delete $('sheet').dataset.lock;closeSheet();tab='over';render()});
}
function _unusedStartTail(){
}

/* ================= Events ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-tab],[data-term],[data-open],[data-choose],[data-accept],[data-lease],[data-buy],[data-ret],[data-sell],[data-hire],[data-fire],[data-train],[data-innov],[data-move],[data-act],[data-act2],[data-close]');if(!el)return;const d=el.dataset;
  if(d.tab)return setTab(d.tab);
  if(d.term){e.preventDefault();return termSheet(d.term)}
  if(d.open==='lex')return lexSheet();if(d.open==='teacher')return teacherSheet();if(d.open==='save')return S?saveSheet():null;
  if(d.close!==undefined)return closeSheet();
  if(d.choose)return choose(d.choose);
  for(const k of ['accept','lease','buy','ret','sell','hire','fire','train','innov','move'])if(d[k]!=null)return act(k,d[k],el);
  if(d.act)return act(d.act,null,el);
  if(d.act2==='anarep'){takeAnswer();return anaSheet(repArgs[0].m,true)}
  if(d.act2==='backrep'){return showReport(...repArgs)}
  if(d.act2==='ana'){return anaSheet(+d.m,false)}
  if(d.act2==='next'){takeAnswer();delete $('sheet').dataset.lock;closeSheet();tab='over';render();return}
  if(d.act2==='final'){takeAnswer();delete $('sheet').dataset.lock;return finalSheet()}
  if(d.act2==='lexall')return lexSheet(d.k);
  if(d.act2==='restart'){if(!confirmTwice(el,'Alles neu?'))return;restart();return}
  if(d.act2==='loadFromStart'){saveSheetLoadOnly();return}
});
function restart(){const pre=S?{name:S.name,klasse:S.klasse,firma:S.firma,lvl:S.lvl,site:S.site}:{};try{localStorage.removeItem(SAVE)}catch(_){}S=null;tab='over';$('view').innerHTML='';startSheet(pre)}
$('restartBtn').onclick=e=>{if(!S)return;if(!confirmTwice(e.currentTarget,'Spielstand löschen?'))return;restart();toast('Neues Planspiel. Deine Angaben sind schon eingetragen.')};
function saveSheetLoadOnly(){
  openSheet(`<span class="chip info" style="align-self:flex-start">Spielstand laden</span><h2>Mit Sicherungscode weiterspielen</h2><textarea id="codeIn" class="codebox" placeholder="Sicherungscode hier einfügen"></textarea><div class="actions"><button class="primary small" id="loadCode" type="button">Laden</button><button class="small" id="backStart" type="button">Zurück</button></div><p class="sub" id="ioMsg"></p>`,true);
  $('sheet').dataset.lock='1';
  $('backStart').onclick=()=>{S=null;delete $('sheet').dataset.lock;startSheet()};
  $('loadCode').onclick=async()=>{try{S=await decodeSave($('codeIn').value);save();delete $('sheet').dataset.lock;closeSheet();tab='over';render();toast('Spielstand geladen.')}catch(e){$('ioMsg').textContent='Das ist kein gültiger Sicherungscode.'}};
}
document.addEventListener('input',e=>{
  if(!S)return;
  if(e.target.id==='spotPrice'){S.spotPrice=+e.target.value;$('spotOut').textContent=eurC(S.spotPrice);const r=simulate(true);$('spotTiles').innerHTML=spotTiles(r);if($('pcmp'))$('pcmp').outerHTML=priceCompare();renderPreview();save()}
  if(e.target.id==='mkt'){S.marketing=+e.target.value;$('mktOut').textContent=eur(S.marketing);const r=simulate(true);$('spotTiles').innerHTML=spotTiles(r);if($('pcmp'))$('pcmp').outerHTML=priceCompare();renderPreview();save()}
});
document.addEventListener('change',e=>{if(S&&e.target.id==='ot'){S.overtime=e.target.checked;save();renderPreview()}});
$('closeMonth').onclick=closeMonth;
const tip=$('tip');
document.addEventListener('pointerover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.hidden=true;return}tip.textContent=t.dataset.tip;tip.hidden=false;const r=t.getBoundingClientRect();tip.style.left=(r.left+r.width/2)+'px';tip.style.top=(r.top)+'px'});
let toastT=0;function toast(m){const el=$('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),3200)}
function save(){try{if(S&&S.veh&&S.name)localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}

/* ================= Start ================= */
DL={save:async({filename,data})=>{const b=new Blob([data],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);return{status:'saved'}}};
try{const raw=localStorage.getItem(SAVE);if(raw){const st=JSON.parse(raw);if(st&&st.v===1&&st.name)S=st}}catch(e){}
if(S){render();if(S.ended)finalSheet()}else startSheet();
})();
</script>
