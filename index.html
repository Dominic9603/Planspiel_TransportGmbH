<style>
/* Layout: a business-report desk. Sticky header with the month and cash, tabbed sections for each department, a sticky month-close bar at the bottom. */
:root{
  --paper:#FBF6EC; --paper-2:#F1E9D8; --card:#FFFFFF; --ink:#232142; --text:#232142; --muted:#676386; --line:#E2D8C3;
  --accent:#E4553F; --accent-ink:#FFFFFF; --gold:#EFAE2E; --good:#2F8A55; --bad:#C8432F; --info:#3E6FB8;
  --good-bg:#E3F2E8; --bad-bg:#FBE4DF; --gold-bg:#FCF0D2; --info-bg:#E2ECF8; --chip:#F1E9D8;
  --display:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17162B; --paper-2:#211F3B; --card:#26244A; --ink:#0C0B1D; --text:#ECE9FA; --muted:#A8A4C8; --line:#36345C;
  --accent:#F06A55; --gold:#F2B94A; --good:#5BC488; --bad:#F07A66; --info:#7FA8E8;
  --good-bg:#1D3A2A; --bad-bg:#45232A; --gold-bg:#40341A; --info-bg:#1E2C48; --chip:#302E58; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17162B; --paper-2:#211F3B; --card:#26244A; --ink:#0C0B1D; --text:#ECE9FA; --muted:#A8A4C8; --line:#36345C;
  --accent:#F06A55; --gold:#F2B94A; --good:#5BC488; --bad:#F07A66; --info:#7FA8E8;
  --good-bg:#1D3A2A; --bad-bg:#45232A; --gold-bg:#40341A; --info-bg:#1E2C48; --chip:#302E58; color-scheme:dark}
[hidden]{display:none!important}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
html,body{background:var(--paper);color:var(--text)}
body{font-family:var(--body);font-size:15px;line-height:1.5}
.app{max-width:1120px;margin:0 auto;padding-block:12px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{margin-right:auto;min-width:0}
.brand h1{font-family:var(--display);font-weight:800;letter-spacing:-.01em;font-size:clamp(22px,3.6vw,30px);line-height:1;margin:0}
.brand h1 span{color:var(--accent)}
.brand .firm{font-size:13px;color:var(--muted);font-weight:700;margin-top:4px}
.hstats{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:flex;align-items:baseline;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{font-weight:700;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.pill.neg{color:var(--bad)}
button{font:inherit;font-weight:800;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--text)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.primary:hover:not(:disabled){border-color:var(--text)}
.small{font-size:13px;padding:5px 10px;border-radius:8px}
.linkbtn{border:0;background:none;padding:0;color:var(--info);font-weight:700;text-decoration:underline;text-underline-offset:3px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--paper);padding-block:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
nav.tabs button{flex:none;border-radius:999px;font-size:14px;padding:7px 14px}
nav.tabs button[aria-selected="true"]{background:var(--text);border-color:var(--text);color:var(--paper)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px}
main{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{margin:0;font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;text-wrap:balance}
.panel h2 small{font-size:12.5px;color:var(--muted);font-weight:700}
.panel p{margin:0}
.sub{color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.item{border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--card);min-width:0}
.item .t{font-weight:800;line-height:1.25}
.item .s{font-size:12.5px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-variant-numeric:tabular-nums}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:800;text-align:right}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-block;font-size:11.5px;font-weight:800;border-radius:99px;padding:1px 8px;background:var(--chip);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.gold{background:var(--gold-bg)}.chip.info{background:var(--info-bg);color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.tile .l{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .d{font-size:12.5px;color:var(--muted)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.event{border-left:6px solid var(--gold);background:var(--gold-bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.event .k{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.event .t{font-size:17px;font-weight:800}
.task{border-left:6px solid var(--info);background:var(--info-bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
textarea,input[type=text],input[type=number],select{font:inherit;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;box-sizing:border-box}
textarea{min-height:76px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--accent)}
.range output{font-weight:800;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.term{border:0;background:none;padding:0;font:inherit;color:inherit;font-weight:inherit;text-decoration:underline dotted;text-decoration-color:var(--info);text-underline-offset:3px;cursor:help}
table.fin{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.fin td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.fin td:last-child,table.fin td.n{text-align:right;white-space:nowrap}
table.fin tr.sum td{font-weight:800;border-top:2px solid var(--text);border-bottom:0}
table.fin tr.grp td{font-weight:800;padding-top:10px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
table.fin td.ind{padding-left:14px}
.tablewrap{overflow-x:auto}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--text);color:var(--paper);font-size:12.5px;font-weight:700;padding:5px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-120%)}
.closebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.closebar .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.closebar .pv{flex:1 1 260px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.closebar .pv b{color:var(--text)}
.closebar .primary{font-size:16px;padding:10px 18px}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(20,18,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));overflow:auto}
.sheet{background:var(--paper);color:var(--text);border-radius:18px;padding:18px;max-width:760px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet>*{flex-shrink:0}
.sheet.narrow{max-width:520px}
.sheet h2{margin:0;font-size:22px;font-weight:800;line-height:1.15;text-wrap:balance}
.sheet .x{align-self:flex-end;margin-bottom:-38px}
.big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.lvl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.lvl{grid-template-columns:minmax(0,1fr)}}
.lvl label{border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;cursor:pointer;background:var(--card)}
.lvl label:has(input:checked){border-color:var(--accent)}
.lvl b{display:block}
.lvl span{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--text);color:var(--paper);font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.lex dt{font-weight:800;margin-top:10px}
.lex dd{margin:2px 0 0;color:var(--text);font-size:14px}
.lex dd .ex{color:var(--muted);font-size:13px;display:block;margin-top:2px}
.lex dt.hl{color:var(--accent)}
.vicon{width:64px;height:40px;flex:none}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.empty{color:var(--muted);font-size:14px}
.warnbox{background:var(--bad-bg);color:var(--bad);font-weight:700;border-radius:10px;padding:8px 12px;font-size:13.5px}
.codebox{font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;min-height:70px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<noscript><p style="padding:16px">Bitte JavaScript aktivieren, um das Planspiel zu spielen.</p></noscript>
<div class="app">

    <div class="brand"><h1>Paketdienst<span>-</span>Planspiel</h1><div class="firm" id="firm"></div></div>

</div>
<div class="closebar"><div class="in"><div class="pv" id="preview"></div><button class="primary" id="closeMonth" type="button">Monat abschließen</button></div></div>

<script>
(function(){
'use strict';
const SAVE='paketdienst-planspiel-v1';
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const eur=n=>(n<-0.5?'−':'')+Math.abs(Math.round(n)).toLocaleString('de-AT')+' €';
const eurC=n=>n.toLocaleString('de-AT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const num=n=>Math.round(n).toLocaleString('de-AT');
const pct=x=>Math.round(x*100)+' %';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= Annahmen (vereinfacht, angelehnt an österreichische Werte 2026, alle Beträge netto) ================= */
const MONTHS=['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WORKDAYS=[20,20,22,21,19,21,22,21,22,21,20,19];
const SEASON_SPOT=[.9,.9,1,1,1,1,.85,.85,1,1.05,1.35,1.45];
const PRICE={diesel:1.45,strom:.28};
const LNK=.29;            // Lohnnebenkosten Dienstgeber (Sozialversicherung, DB, DZ, Kommunalsteuer, MV)
const KOEST=.23;          // Körperschaftsteuer
const START_CAPITAL=30000;
const OD_LIMIT=15000, OD_RATE=.11, LOAN_RATE=.065;
const LIC=['ohne','B','C1','CE'];
const LICNAME=['kein Führerschein nötig','Führerschein B (bis 3,5 t)','Führerschein C1 (bis 7,5 t)','Führerschein C + E (Sattelzug)'];
const WAGE=[2300,2350,2550,2850];
const TRAIN={2:{cost:2400,from:1},3:{cost:4200,from:2}};
const VEH={
  rad:{name:'E-Lastenrad',icon:'rad',lic:0,buy:7500,lease:180,ins:15,maint:45,life:5,cons:1.5,fuel:'strom',capP:95,km:40,eco:true,seg:'stadt',desc:'Für enge Innenstädte. Viele Stopps, wenig Platz, kaum Energiekosten.'},
  van:{name:'Transporter Diesel 3,5 t',icon:'van',lic:1,buy:42000,lease:850,ins:180,maint:130,life:5,cons:10,fuel:'diesel',capP:140,km:90,seg:'stadt',desc:'Das Arbeitstier der Paketzustellung.'},
  evan:{name:'E-Transporter 3,5 t',icon:'evan',lic:1,buy:52000,lease:990,ins:160,maint:70,life:6,cons:24,fuel:'strom',capP:130,km:90,eco:true,seg:'stadt',desc:'Elektrisch und leise. Teurer in der Anschaffung, günstig im Betrieb.'},
  kuehl:{name:'Kühltransporter 3,5 t',icon:'kuehl',lic:1,buy:58000,lease:1150,ins:200,maint:170,life:5,cons:12,fuel:'diesel',seg:'kuehl',desc:'Hält Medikamente und Lebensmittel konstant kühl.'},
  lkw:{name:'Lkw 7,5 t',icon:'lkw',lic:2,buy:85000,lease:1650,ins:350,maint:260,life:8,cons:18,fuel:'diesel',maut:.24,seg:'lkw',desc:'Für Paletten und Möbel. Auf Autobahnen mautpflichtig.'},
  sattel:{name:'Sattelzug 40 t',icon:'sattel',lic:3,buy:140000,lease:2700,ins:620,maint:450,life:8,cons:30,fuel:'diesel',maut:.42,seg:'fern',adv:true,desc:'Fernverkehr. Hoher Umsatz, aber auch hohe Kosten für Diesel und Maut.'},
};
const SEG={
  stadt:{name:'Paketzustellung Stadt',unit:'Pakete',veh:['rad','evan','van']},
  express:{name:'Expresskurier',unit:'Einsatztage',veh:['evan','van']},
  kuehl:{name:'Kühltransport',unit:'Einsatztage',veh:['kuehl']},
  lkw:{name:'Regional-Lkw',unit:'Einsatztage',veh:['lkw']},
  fern:{name:'Fernverkehr',unit:'Einsatztage',veh:['sattel'],adv:true},
};
const CLIENTS={
  stadt:['Onlineshop Alpenkiste','Modehaus Lindner','Sportversand Gipfelwerk','Buchhandlung Seitenwind','Biokiste Wienerwald','Elektro Pichler Versand','Tierbedarf Pfotenglück'],
  express:['Anwaltskanzlei Brandstätter','Labor Dr. Wiesinger','Druckerei Sonnleitner','Ersatzteile Haider','Architekturbüro Linie 5'],
  kuehl:['Apotheken-Großhandel Medivita','Feinkost Rauchenberger','Molkerei Almtal','Blumen Frühlingsgruß'],
  lkw:['Möbelhaus Kranzl','Baumarkt Hammerl','Getränke Hörmann','Fliesen Steinwender','Druckerei Sonnleitner'],
  fern:['Spedition Danubia (Subauftrag)','Holzindustrie Murtal','Autoteile Steyrtal','Papierfabrik Ennsufer'],
};
const FIRST=['Lukas','Anna','David','Lea','Elias','Sophie','Jonas','Laura','Tobias','Marie','Fabian','Sarah','Emir','Jelena','Mehmet','Katarina','Florian','Hannah','Noah','Ivana','Stefan','Julia','Ali','Theresa'];
const LAST=['Gruber','Huber','Bauer','Wagner','Pichler','Steiner','Moser','Mayer','Hofer','Leitner','Berger','Fuchs','Eder','Fischer','Schwarz','Novak','Yilmaz','Petrović','Kaya','Horvath','Winkler','Weber'];

/* ================= Lexikon ================= */
const TERMS={
  umsatz:['Umsatz','Alles Geld, das du für deine Leistungen verrechnest: Menge mal Preis.','Im Spiel: zugestellte Pakete mal Preis pro Paket plus Einsatztage mal Tagessatz.'],
  kosten:['Kosten','Der Wert aller Mittel, die du für deine Leistung verbrauchst, zum Beispiel Löhne, Diesel, Miete.',''],
  fix:['Fixkosten','Kosten, die jeden Monat gleich anfallen, egal wie viel du lieferst.','Im Spiel: Löhne, Leasingraten, Versicherung, Miete für das Depot.'],
  var:['Variable Kosten','Kosten, die mit der Menge steigen. Je mehr du fährst, desto mehr fallen an.','Im Spiel: Diesel und Strom, Maut, Spesen.'],
  gewinn:['Gewinn und Verlust','Umsatz minus Kosten. Ist das Ergebnis negativ, spricht man von Verlust.',''],
  db:['Deckungsbeitrag','Umsatz minus variable Kosten. Er zeigt, wie viel ein Auftrag zur Deckung der Fixkosten beiträgt.','Ein Auftrag mit positivem Deckungsbeitrag kann sich lohnen, auch wenn der Monat insgesamt Verlust macht.'],
  afa:['Abschreibung (AfA)','Ein gekauftes Fahrzeug wird über seine Nutzungsdauer als Kosten verteilt, nicht auf einmal.','Ein Transporter um 42.000 € mit 5 Jahren Nutzungsdauer kostet 700 € Abschreibung pro Monat.',true],
  leasing:['Leasing','Du mietest ein Fahrzeug langfristig und zahlst eine monatliche Rate. Es gehört dir nicht.','Vorteil: kein großer Betrag auf einmal. Nachteil: auf Dauer meist teurer als Kaufen.'],
  kredit:['Kredit','Geld, das du dir von der Bank leihst. Du zahlst es in Raten zurück (Tilgung) und zahlst zusätzlich Zinsen.','',true],
  zinsen:['Zinsen','Der Preis für geliehenes Geld, angegeben in Prozent pro Jahr.',''],
  kk:['Kontokorrent (Überziehung)','Wenn dein Konto unter null fällt, überzieht die Bank für dich. Dafür verlangt sie hohe Zinsen.','Im Spiel: bis −15.000 € erlaubt, 11 % Zinsen pro Jahr.'],
  liq:['Liquidität','Die Fähigkeit, Rechnungen rechtzeitig zu bezahlen. Ein Unternehmen kann Gewinn machen und trotzdem zahlungsunfähig werden.','Beispiel: Der Kauf eines Lkw drückt den Kontostand sofort, obwohl er sich erst über Jahre als Kosten zeigt.'],
  ek:['Eigenkapital','Das Geld, das den Eigentümern gehört: Startkapital plus Gewinne minus Verluste.','',true],

/* ================= Zustand ================= */
let S=null,tab='over',lastReport=null;
const adv=()=>S&&S.lvl==='adv';
const mi=()=>S.m%12, yr=()=>2027+Math.floor(S.m/12), monthName=(m=S.m)=>`${MONTHS[m%12]} ${2027+Math.floor(m/12)}`;
function mkDriver(lic,wage){return{id:S.nid++,name:`${pick(FIRST)} ${pick(LAST)}`,lic,wage:wage||WAGE[lic],sick:0,train:0}}
function mkVeh(type,own){const t=VEH[type];return{id:S.nid++,type,own,age:0,bw:own==='buy'?t.buy:0,down:0}}
function newGame(o){
  S={v:1,name:o.name,klasse:o.klasse,firma:o.firma,lvl:o.lvl,m:0,cash:START_CAPITAL,ruf:50,nid:1,veh:[],drv:[],contracts:[],offers:[],cands:[],
     spotPrice:2.5,marketing:0,overtime:false,depotBig:false,loans:[],mods:[],oneoff:[],history:[],tasks:{},event:null,insolv:0,rentMult:1,wageIdx:1,ended:false,started:Date.now()};

  startMonth(true);save();
}

/* ================= Monatsbeginn: Angebote, Bewerbungen, Ereignis ================= */
function genOffer(seg){
  const f=.93+S.ruf/700,c={id:S.nid++,client:pick(CLIENTS[seg]),seg,ab:0,bon:'A'};
  if(seg==='stadt'){c.qty=pick([1200,1500,2000,2500,3000,4000,5000]);if(mi()>=10)c.qty=Math.round(c.qty*1.3/100)*100;c.price=+(rnd(2.05,2.75)*f).toFixed(2);c.km=90;c.months=pick([1,3,3,6,6,12])}
  if(seg==='express'){c.qty=pick([8,10,12,15,20]);c.price=Math.round(rnd(310,390)*f/5)*5;c.km=160;c.months=pick([1,2,3,6])}
  if(seg==='kuehl'){c.qty=pick([10,12,15,20]);c.price=Math.round(rnd(380,440)*f/5)*5;c.km=180;c.months=pick([3,6,12])}
  if(seg==='lkw'){c.qty=pick([10,12,15,20]);c.price=Math.round(rnd(420,520)*f/5)*5;c.km=220;c.ab=.5;c.months=pick([1,3,6])}
  if(seg==='fern'){c.qty=pick([15,18,20]);c.price=Math.round(rnd(960,1100)*f/10)*10;c.km=600;c.ab=.9;c.months=pick([1,3,6])}
  if(adv()){const b=Math.random();c.bon=b<.6?'A':b<.85?'B':'C';if(c.bon==='B')c.price=+(c.price*1.04).toFixed(2);if(c.bon==='C')c.price=+(c.price*1.1).toFixed(2)}
  return c;
}
function startMonth(first){
  // Angebote
  const segs=['stadt','stadt','stadt','express','express','lkw','lkw','kuehl'];if(adv())segs.push('fern','fern');
  const n=4+(S.ruf>65?1:0)+(mi()>=10?1:0)-(S.ruf<30?1:0);
  S.offers=Array.from({length:n},()=>genOffer(pick(segs)));
  // Bewerbungen
  S.cands=Array.from({length:3},()=>{const r=Math.random(),l=r<.55?1:r<.82?2:(adv()?3:2);const d=mkDriver(l);d.wage=Math.round((WAGE[l]*S.wageIdx+ri(-60,140))/10)*10;return d});
  // jährliche Anpassungen (Jänner ab Jahr 2)
  S.yearNote='';
  if(mi()===0&&S.m>0){S.wageIdx*=1.032;S.drv.forEach(d=>d.wage=Math.round(d.wage*1.032));S.rentMult*=1.03;S.yearNote='Neues Jahr: Die Löhne steigen laut Kollektivvertrag um 3,2 %, die Depotmiete wird um 3 % an die Inflation angepasst.'}
  S.mods=S.mods.filter(x=>x.until>S.m);
  S.oneoff=[];
  if(mi()===10)S.veh.filter(v=>v.type!=='rad').forEach(v=>addOne(`Winterreifen ${VEH[v.type].name}`,v.type==='van'||v.type==='evan'||v.type==='kuehl'?380:900,'maint'));
  S.event=first?{id:'start',t:'Willkommen in deinem Unternehmen!',x:'Du übernimmst einen kleinen Paketdienst in Wien mit 2 geleasten Transportern, 2 Fahrer:innen und einem ersten Auftrag. Startkapital: 30.000 €. Schau dir alle Bereiche an, triff deine Entscheidungen und schließe dann den Monat ab.',term:'umsatz'}:drawEvent();
}
const addMod=(key,val,dur)=>S.mods.push({key,val,until:S.m+dur});
const addOne=(label,amount,cat,cash=true)=>S.oneoff.push({label,amount,cat,cash});
function drawEvent(){
  const d=S.drv.length?pick(S.drv):null,v=S.veh.length?pick(S.veh):null;
  const city=S.contracts.filter(c=>c.left>1);
  const deck=[
    {id:'diesel_up',w:2,t:'Dieselpreis steigt',x:'Wegen höherer Rohölpreise kostet Diesel diesen und nächsten Monat 15 % mehr.',term:'var',fx:()=>addMod('diesel',1.15,2)},
    {id:'diesel_down',w:1,t:'Diesel wird billiger',x:'Der Dieselpreis sinkt diesen und nächsten Monat um 10 %.',term:'var',fx:()=>addMod('diesel',.9,2)},
    d&&{id:'sick',w:2,t:'Krankenstand',x:`${d.name} ist diesen Monat 6 Arbeitstage krank. Der Lohn wird trotzdem bezahlt.`,term:'entgelt',fx:()=>{d.sick=6}},
    v&&{id:'accident',w:1.5,t:'Blechschaden',x:`Ein ${VEH[v.type].name} hatte einen kleinen Unfall und steht 4 Tage in der Werkstatt. Selbstbehalt: 1.000 €.`,term:'vers',fx:()=>{v.down=4;addOne('Selbstbehalt Unfall',1000,'repair')}},
    {id:'compet',w:1.5,t:'Neue Konkurrenz',x:'Ein neuer Paketdienst unterbietet die Preise. Die Nachfrage am freien Markt sinkt 2 Monate um 20 %.',term:'wettbewerb',fx:()=>addMod('spot',.8,2)},
    {id:'boom',w:1.5,t:'Online-Boom',x:'Mehr Menschen bestellen online. Die Nachfrage am freien Markt steigt 2 Monate um 20 %.',term:'nachfrage',fx:()=>addMod('spot',1.2,2)},
    {id:'subsidy',w:1,t:'Förderung für E-Fahrzeuge',x:'Diesen Monat bekommst du für jedes neue E-Fahrzeug eine Förderung: 20 % vom Kaufpreis beim Kauf oder 2.000 € beim Leasing.',term:'kosten',fx:()=>{S.ecoBonus=S.m}},
    {id:'review',w:1,t:'Top-Bewertungen',x:'Kundinnen und Kunden loben eure Pünktlichkeit im Internet. Dein Ruf steigt um 5 Punkte.',term:'nachfrage',fx:()=>{S.ruf=Math.min(100,S.ruf+5)}},
    {id:'jam',w:1,t:'Baustellen und Stau',x:'Wegen vieler Umleitungen sind alle Fahrten diesen Monat 10 % länger. Das kostet mehr Treibstoff und Maut.',term:'var',fx:()=>addMod('km',1.1,1)},
    {id:'insurance',w:.8,t:'Versicherung wird teurer',x:'Die Versicherung erhöht ab sofort die Prämien für alle Fahrzeuge um 10 %.',term:'fix',fx:()=>addMod('ins',1.1,120)},
    city.length&&{id:'discount',w:1.5,t:'Kunde fordert Rabatt',c:city[0].id,x:`${city[0].client} verlangt 8 % Rabatt. Sonst endet der Vertrag nach diesem Monat.`,term:'wettbewerb',choice:[['Rabatt geben','discount_yes'],['Ablehnen','discount_no']]},
    d&&{id:'raise',w:1.2,t:'Wunsch nach Gehaltserhöhung',dId:d.id,x:`${d.name} möchte 150 € mehr Bruttolohn pro Monat. Sonst sucht sich ${d.name.split(' ')[0]} vielleicht einen anderen Job.`,term:'brutto',choice:[['Gehalt erhöhen','raise_yes'],['Ablehnen','raise_no']]},
    {id:'ad',w:1,t:'Angebot einer Werbeagentur',x:'Eine Werbekampagne kostet einmalig 2.500 € und steigert deinen Ruf um 8 Punkte.',term:'kosten',choice:[['Kampagne buchen','ad_yes'],['Nein danke','ad_no']]},
    adv()&&S.contracts.some(c=>c.bon==='C')&&{id:'default',w:2,t:'Kunde zahlt nicht',c:S.contracts.find(c=>c.bon==='C').id,x:`${S.contracts.find(c=>c.bon==='C').client} hat Zahlungsschwierigkeiten und zahlt die Leistung dieses Monats nicht.`,term:'bon',fx:function(){const c=S.contracts.find(x=>x.id===this.c);if(c)c.noPay=S.m}},
  ].filter(Boolean);
  const tot=deck.reduce((a,e)=>a+e.w,0);let r=Math.random()*tot,e=deck[0];for(const x of deck){r-=x.w;if(r<=0){e=x;break}}
  if(e.fx)e.fx.call(e);
  return{id:e.id,t:e.t,x:e.x,term:e.term,choice:e.choice||null,chosen:null,c:e.c,dId:e.dId};
}
function choose(key){
  const e=S.event;if(!e||e.chosen)return;e.chosen=key;
  const c=S.contracts.find(x=>x.id===e.c),d=S.drv.find(x=>x.id===e.dId);
  if(key==='discount_yes'&&c){c.price=+(c.price*.92).toFixed(2);e.res='Der Vertrag läuft mit 8 % weniger Preis weiter.'}
  if(key==='discount_no'&&c){c.left=Math.min(c.left,1);e.res='Der Vertrag endet nach diesem Monat.'}
  if(key==='raise_yes'&&d){d.wage+=150;e.res=`${d.name} bleibt motiviert im Team.`}
  if(key==='raise_no'&&d){if(Math.random()<.5){S.drv=S.drv.filter(x=>x!==d);e.res=`${d.name} hat gekündigt und ist ab sofort weg.`}else e.res=`${d.name} bleibt, ist aber enttäuscht.`}
  if(key==='ad_yes'){addOne('Werbekampagne',2500,'marketing');S.ruf=Math.min(100,S.ruf+8);e.res='Die Kampagne läuft. Dein Ruf ist um 8 gestiegen.'}
  if(key==='ad_no')e.res='Du sparst dir die Ausgabe.';
  save();render();
}

/* ================= Monatsrechnung ================= */
const modv=k=>S.mods.filter(x=>x.key===k&&x.until>S.m).reduce((a,x)=>a*x.val,1);
const breakP=v=>.03+.015*(v.age/12);
function simulate(dry){
  const W=WORKDAYS[mi()],dP=PRICE.diesel*modv('diesel'),kmF=modv('km');
  const r={m:S.m,W,rev:{contracts:0,spot:0},cost:{wage:0,sonder:0,lnk:0,ot:0,fuel:0,maut:0,spesen:0,lease:0,ins:0,maint:0,repair:0,afa:0,rent:0,admin:0,marketing:0,interest:0,penalty:0,other:0,loss:0},fulfill:[],notes:[],spot:{},pairs:0,usedDays:0,availDays:0,purchases:0,sales:0,subsidy:0,loanIn:0};
  // Fahrzeuge verfügbar (zufällige Pannen nur im echten Abschluss)
  const vd={};
  for(const v of S.veh){let d=W-(v.down||0);if(!dry&&Math.random()<breakP(v)){const lost=ri(1,3),cost=ri(4,25)*100;d-=lost;r.cost.repair+=cost;r.notes.push(`Panne: ${VEH[v.type].name} stand ${lost} Tag${lost>1?'e':''} in der Werkstatt (Reparatur ${eur(cost)}).`)}vd[v.id]=Math.max(0,d)}
  // Fahrer:innen den Fahrzeugen zuteilen (höchste Führerscheinklasse zuerst)
  const free=S.drv.map(d=>({d,days:W-(d.sick||0)}));
  const pairs=[];
  for(const v of [...S.veh].sort((a,b)=>VEH[b.type].lic-VEH[a.type].lic)){
    const need=VEH[v.type].lic,c=free.filter(x=>x.d.lic>=need&&x.days>0).sort((a,b)=>a.d.lic-b.d.lic||b.days-a.days)[0];
    if(!c){r.notes.push(`${VEH[v.type].name}: keine passende Fahrerin bzw. kein passender Fahrer (${LIC[need]}). Das Fahrzeug stand still.`);continue}
    const days=Math.min(vd[v.id],c.days);c.days-=days;pairs.push({v,t:VEH[v.type],d:c.d,days,used:0,ot:0,km:0,ab:0});
  }
  r.pairs=pairs.length;r.availDays=pairs.reduce((a,p)=>a+p.days,0);
  const idle=free.filter(x=>!pairs.some(p=>p.d===x.d));if(idle.length)r.notes.push(`${idle.length} Fahrer:in${idle.length>1?'nen':''} ohne Fahrzeug: Lohn läuft trotzdem.`);
  const otMax=S.overtime?3:0;
  const takeDays=(types,need,kmDay,ab)=>{let got=0;for(const pass of [0,1])for(const ty of types)for(const p of pairs){if(p.v.type!==ty)continue;const room=pass?otMax-p.ot:p.days-p.used;if(room<=0||got>=need)continue;const x=Math.min(room,need-got);if(pass)p.ot+=x;else p.used+=x;p.km+=x*kmDay*kmF;p.ab+=x*kmDay*kmF*ab;got+=x}return got};
  const takePak=(need,allowOt)=>{let got=0;for(const pass of allowOt?[0,1]:[0])for(const ty of SEG.stadt.veh)for(const p of pairs){if(p.v.type!==ty)continue;const room=(pass?otMax-p.ot:p.days-p.used)*p.t.capP;if(room<=0||got>=need)continue;const x=Math.min(room,need-got),dd=x/p.t.capP;if(pass)p.ot+=dd;else p.used+=dd;p.km+=dd*p.t.km*kmF;got+=x}return got};
  for(const c of S.contracts){
    const done=c.seg==='stadt'?takePak(c.qty,true):takeDays(SEG[c.seg].veh,c.qty,c.km,c.ab);
    const val=done*c.price,miss=(c.qty-done)*c.price,pen=miss*.3,paid=c.noPay===S.m?0:val;
    if(c.noPay===S.m)r.notes.push(`${c.client} hat nicht bezahlt: ${eur(val)} Forderungsausfall.`);
    r.rev.contracts+=paid;r.cost.penalty+=pen;r.fulfill.push({id:c.id,client:c.client,seg:c.seg,need:c.qty,done,val:paid,pen,unit:SEG[c.seg].unit});
    if(c.seg==='fern')r.cost.spesen+=done*45;
  }
  const freeD=types=>pairs.filter(p=>types.includes(p.v.type)).reduce((a,p)=>a+Math.max(0,p.days-p.used),0);
  r.free={stadt:Math.floor(pairs.filter(p=>SEG.stadt.veh.includes(p.v.type)).reduce((a,p)=>a+Math.max(0,p.days-p.used)*p.t.capP,0)),express:Math.floor(freeD(SEG.express.veh)),kuehl:Math.floor(freeD(['kuehl'])),lkw:Math.floor(freeD(['lkw'])),fern:Math.floor(freeD(['sattel']))};
  // freier Markt (Laufkundschaft)
  const cap=pairs.filter(p=>SEG.stadt.veh.includes(p.v.type)).reduce((a,p)=>a+(p.days-p.used)*p.t.capP,0);
  const mk=1+.3*(1-Math.exp(-S.marketing/1500));
  const demand=Math.round(2400*SEASON_SPOT[mi()]*modv('spot')*(.55+S.ruf/110)*Math.pow(2.5/S.spotPrice,1.8)*mk);
  const served=Math.floor(takePak(Math.min(demand,cap),false));
  r.spot={price:S.spotPrice,demand,served,cap:Math.round(cap)};r.rev.spot=served*S.spotPrice;
  // Fahrzeugkosten
  for(const p of pairs){const e=p.t.fuel==='diesel'?dP:PRICE.strom;r.cost.fuel+=p.km*p.t.cons/100*e;r.cost.maut+=p.ab*(p.t.maut||0);r.usedDays+=p.used}
  for(const v of S.veh){const t=VEH[v.type];if(v.own==='lease')r.cost.lease+=t.lease;else r.cost.afa+=t.buy/(t.life*12);r.cost.ins+=t.ins*modv('ins');r.cost.maint+=t.maint}
  // Personal
  const sonder=mi()===5||mi()===10;
  for(const d of S.drv){r.cost.wage+=d.wage;if(sonder)r.cost.sonder+=d.wage}
  const otDays=pairs.reduce((a,p)=>a+p.ot,0);
  for(const p of pairs)r.cost.ot+=p.ot*p.d.wage/21.7*1.5;
  if(otDays>0)r.notes.push(`Überstunden: ${num(otDays)} zusätzliche Einsatztage.`);
  r.cost.lnk=(r.cost.wage+r.cost.sonder+r.cost.ot)*LNK;
  // Gemeinkosten
  r.cost.rent=(S.depotBig?4200:2400)*S.rentMult;r.cost.admin=650;r.cost.marketing=S.marketing;
  const loanDebt=S.loans.reduce((a,l)=>a+l.left,0);r.cost.interest=loanDebt*LOAN_RATE/12+(S.cash<0?-S.cash*OD_RATE/12:0);
  for(const o of S.oneoff){if(o.cat==='purchase')r.purchases+=o.amount;else if(o.cat==='sale')r.sales+=o.amount;else if(o.cat==='subsidy')r.subsidy+=o.amount;else if(o.cat==='loanIn')r.loanIn+=o.amount;else if(o.cat==='tilg'){}else r.cost[r.cost[o.cat]!=null?o.cat:'other']+=o.amount}
  r.tilg=S.loans.reduce((a,l)=>a+Math.min(l.left,l.rate),0)+S.oneoff.filter(o=>o.cat==='tilg').reduce((a,o)=>a+o.amount,0);
  // Summen
  r.revTotal=r.rev.contracts+r.rev.spot+r.subsidy;
  r.costTotal=Object.values(r.cost).reduce((a,b)=>a+b,0);
  r.profit=r.revTotal-r.costTotal;
  r.cashDelta=r.revTotal-(r.costTotal-r.cost.afa)-r.purchases+r.sales+r.loanIn-r.tilg;
  r.util=r.availDays?Math.min(1,r.usedDays/r.availDays):0;
  r.varCost=r.cost.fuel+r.cost.maut+r.cost.spesen;
  r.db=r.revTotal-r.varCost;
  return r;
}

/* ================= Monat abschließen ================= */
function closeMonth(){
  if(!S||S.ended)return;
  if(S.event&&S.event.choice&&!S.event.chosen){toast('Triff zuerst die Entscheidung auf der Ereigniskarte.');setTab('over');return}
  const r=simulate(false);
  // Ruf
  const need=r.fulfill.reduce((a,f)=>a+f.need*S.contracts.find(c=>c.id===f.id).price,0),done=r.fulfill.reduce((a,f)=>a+f.val+(f.pen?f.done*0:0),0);
  const fr=r.fulfill.length?r.fulfill.reduce((a,f)=>a+f.done/f.need,0)/r.fulfill.length:1;
  const eco=S.veh.length?S.veh.filter(v=>VEH[v.type].eco).length/S.veh.length:0;
  const ruf0=S.ruf;
  S.ruf+=fr>=.999?2:-(1-fr)*25;S.ruf+=Math.min(3,S.marketing/800);if(eco>=.3)S.ruf+=1;if(S.spotPrice>3.2)S.ruf-=1;
  S.ruf=Math.max(0,Math.min(100,Math.round(S.ruf)));r.ruf0=ruf0;r.ruf=S.ruf;r.fr=fr;
  // Kasse
  const cash0=S.cash;S.cash+=r.cashDelta;r.cash0=cash0;r.cash=S.cash;
  // Kredite tilgen
  for(const l of S.loans){l.left=Math.max(0,l.left-l.rate)}S.loans=S.loans.filter(l=>l.left>0.5);
  // Fahrzeuge altern, Buchwert sinkt
  for(const v of S.veh){v.age++;v.down=0;if(v.own==='buy'){const t=VEH[v.type];v.bw=Math.max(0,v.bw-t.buy/(t.life*12))}}
  // Personal
  for(const d of S.drv){d.sick=0;if(d.train){d.lic=d.train;d.wage=Math.max(d.wage,Math.round(WAGE[d.lic]*S.wageIdx));r.notes.push(`${d.name} hat die Ausbildung bestanden: ${LIC[d.lic]}.`);d.train=0}}
  // Verträge
  for(const c of S.contracts){c.left--;c.lastFr=(r.fulfill.find(f=>f.id===c.id)||{}).done/c.qty}
  const ended=S.contracts.filter(c=>c.left<=0);if(ended.length)r.notes.push(`Ausgelaufen: ${ended.map(c=>c.client).join(', ')}.`);
  S.contracts=S.contracts.filter(c=>c.left>0);
  // Jahresabschluss
  r.tax=0;
  if(mi()===11){const yp=S.history.filter(h=>Math.floor(h.m/12)===Math.floor(S.m/12)).reduce((a,h)=>a+h.profit,0)+r.profit;r.yearProfit=yp;if(yp>0){r.tax=Math.round(yp*KOEST);S.cash-=r.tax;r.cash=S.cash}}
  // Insolvenz
  if(S.cash<-OD_LIMIT){S.insolv++;r.notes.push(S.insolv>=3?'Das Konto ist zum dritten Mal hintereinander unter dem Überziehungsrahmen. Die Bank kündigt alle Kredite.':`Achtung (${S.insolv}. Mahnung): Dein Konto liegt unter −${num(OD_LIMIT)} €. Liegt es drei Monate hintereinander darunter, ist dein Unternehmen zahlungsunfähig. Verbessere jetzt deine ${T('liq','Liquidität')}: weniger Kosten, mehr Aufträge${adv()?', Kredit oder Fahrzeug verkaufen':', Fahrzeuge zurückgeben'}.`)}else S.insolv=0;
  r.yearNote=S.yearNote||'';r.event={t:S.event&&S.event.t,res:S.event&&S.event.res};
  r.task=pickTask(r);S.tasks[S.m]={q:r.task,a:''};
  S.history.push(r);lastReport=r;
  const isYearEnd=mi()===11,bust=S.insolv>=3;
  S.m++;
  if(bust)S.ended='insolvent';
  else startMonth(false);
  save();render();showReport(r,isYearEnd,bust);
}
function pickTask(r){
  const m=r.m%12,prev=S.history[S.history.length-1];
  const L=[];
  if(m===5||m===10)L.push('Warum sind die Lohnkosten diesen Monat fast doppelt so hoch wie sonst? Erkläre den Begriff 13. bzw. 14. Gehalt.');
  if(r.cash<0)L.push('Dein Konto ist im Minus. Erkläre den Unterschied zwischen Gewinn und Liquidität. Was kannst du tun, damit das Konto wieder ins Plus kommt?');
  if(r.profit<0)L.push('Dein Unternehmen hat diesen Monat Verlust gemacht. Nenne zwei Kosten, die du senken könntest, oder zwei Wege, mehr Umsatz zu machen. Begründe kurz.','Schau in deine Abrechnung: Welche drei Ausgaben waren diesen Monat am größten? Welche davon sind Fixkosten, welche variable Kosten?','Was müsste sich ändern, damit du im nächsten Monat Gewinn machst? Rechne grob nach.');
  if(r.fulfill.some(f=>f.done<f.need))L.push('Du konntest nicht alle Aufträge erfüllen. Welche Folgen hat das für dein Unternehmen? Was würdest du nächsten Monat anders machen?');
  if(r.purchases>0&&adv())L.push('Du hast ein Fahrzeug gekauft. Warum erscheint der Kaufpreis nicht vollständig als Kosten in der Erfolgsrechnung dieses Monats?');
  if(prev&&Math.abs(prev.spot.price-r.spot.price)>.05)L.push(`Du hast den Preis am freien Markt von ${eurC(prev.spot.price)} auf ${eurC(r.spot.price)} geändert. Wie haben sich Nachfrage und Umsatz verändert? Erkläre den Zusammenhang.`);
  if(r.util<.6&&r.pairs>0)L.push('Deine Fahrzeuge waren nur wenig ausgelastet. Warum ist eine geringe Auslastung für ein Unternehmen teuer?');
  if(r.tax>0)L.push(`Du zahlst ${eur(r.tax)} Körperschaftsteuer. Wofür verwendet der Staat Steuern? Nenne zwei Beispiele.`);
  if(r.event&&r.event.t&&r.m>0)L.push(`Ereignis des Monats: „${r.event.t}“. Wie hat sich das auf dein Unternehmen ausgewirkt?`);
  L.push('Was war deine wichtigste Entscheidung in diesem Monat und warum hast du sie so getroffen?','Nenne drei Fixkosten deines Unternehmens und erkläre, warum sie auch dann anfallen, wenn ein Fahrzeug stillsteht.','Wie hat sich dein Kontostand seit dem Start verändert? Erkläre, woran das liegt.','Was würdest du einer Freundin oder einem Freund raten, die bzw. der einen Paketdienst gründen will?','Leasen oder kaufen: Was spricht für das eine, was für das andere?');
  const recent=Object.values(S.tasks).slice(-4).map(t=>t.q);
  return L.find(q=>!recent.includes(q))||L[L.length-1];
}

function estDB(c){

/* ================= Diagramme ================= */
function nice(max){const p=Math.pow(10,Math.floor(Math.log10(max||1))),m=max/p;return(m<=1?1:m<=2?2:m<=5?5:10)*p}
function barChart(vals,labels){
  const W=600,H=220,L=58,R=10,Tp=12,B=26,n=vals.length,mx=Math.max(1,...vals.map(Math.abs));
  const hi=Math.max(0,...vals),lo=Math.min(0,...vals),step=nice((hi-lo||1)/4),top=Math.ceil(hi/step)*step||step,bot=Math.floor(lo/step)*step;
  const y=v=>Tp+(top-v)/(top-bot)*(H-Tp-B),bw=Math.min(36,(W-L-R)/n*.62),x=i=>L+(i+.5)*(W-L-R)/n;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ergebnis je Monat">`;
  for(let v=bot;v<=top+1e-6;v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v===0?1.5:1}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${num(v/1000)}k</text>`;
  vals.forEach((v,i)=>{const y0=y(0),y1=y(v),hgt=Math.max(1,Math.abs(y1-y0));s+=`<rect x="${x(i)-bw/2}" y="${Math.min(y0,y1)}" width="${bw}" height="${hgt}" rx="3" fill="${v<0?'var(--bad)':'var(--good)'}" data-tip="${labels[i]}: ${eur(v)}"/><text x="${x(i)}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`});
  return s+'</svg>';
}
function lineChart(vals,labels){
  const W=600,H=220,L=58,R=14,Tp=12,B=26,n=vals.length;
  const hi=Math.max(0,...vals),lo=Math.min(0,...vals),step=nice((hi-lo||1)/4),top=Math.ceil(hi/step)*step||step,bot=Math.floor(lo/step)*step;
  const y=v=>Tp+(top-v)/(top-bot)*(H-Tp-B),x=i=>L+(n>1?i/(n-1):.5)*(W-L-R);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kontostand je Monat">`;
  for(let v=bot;v<=top+1e-6;v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v===0?1.5:1}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${num(v/1000)}k</text>`;
  if(bot<=-OD_LIMIT)s+=`<line x1="${L}" x2="${W-R}" y1="${y(-OD_LIMIT)}" y2="${y(-OD_LIMIT)}" stroke="var(--bad)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W-R}" y="${y(-OD_LIMIT)-5}" text-anchor="end">Überziehungsgrenze</text>`;
  s+=`<polyline fill="none" stroke="var(--info)" stroke-width="2" points="${vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}"/>`;
  vals.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===n-1?5:3.5}" fill="${v<0?'var(--bad)':'var(--info)'}" stroke="var(--card)" stroke-width="2"/><circle cx="${x(i)}" cy="${y(v)}" r="14" fill="transparent" data-tip="${labels[i]}: ${eur(v)}"/>`;if(n<=13||i%2===0)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`});
  return s+'</svg>';
}

/* ================= Aktionen ================= */
function act(k,arg,el){
  const t=VEH[arg];
  switch(k){
    case'accept':{const c=S.offers.find(o=>o.id===+arg);if(!c)return;S.offers=S.offers.filter(o=>o!==c);c.left=c.months;c.from=S.m;S.contracts.push(c);toast(`Vertrag mit ${c.client} abgeschlossen.`);break}
    case'lease':{if(S.veh.length>=(S.depotBig?16:8))return;S.veh.push(mkVeh(arg,'lease'));if(t.eco&&S.ecoBonus===S.m)addOne(`Förderung ${t.name}`,2000,'subsidy');toast(`${t.name} geleast.`);break}
    case'buy':{if(S.veh.length>=(S.depotBig?16:8))return;const after=S.cash+simulate(true).cashDelta-t.buy;if(after<-OD_LIMIT&&!confirmTwice(el,'Konto rutscht unter das Limit! Trotzdem kaufen?'))return;S.veh.push(mkVeh(arg,'buy'));addOne(`Kauf ${t.name}`,t.buy,'purchase');if(t.eco&&S.ecoBonus===S.m)addOne(`Förderung ${t.name}`,t.buy*.2,'subsidy');toast(`${t.name} gekauft. ${eur(t.buy)} gehen beim Monatsabschluss vom Konto ab.`);break}
    case'ret':{if(!confirmTwice(el,'Wirklich zurückgeben?'))return;const v=S.veh.find(x=>x.id===+arg);if(!v)return;S.veh=S.veh.filter(x=>x!==v);addOne(`Leasing-Rückgabe ${VEH[v.type].name}`,VEH[v.type].lease*(adv()?2:1),'other');toast('Fahrzeug zurückgegeben.');break}
    case'sell':{if(!confirmTwice(el,'Wirklich verkaufen?'))return;const v=S.veh.find(x=>x.id===+arg);if(!v)return;const p=Math.round(v.bw*.85);S.veh=S.veh.filter(x=>x!==v);addOne(`Verkauf ${VEH[v.type].name}`,p,'sale');addOne('Verlust aus Fahrzeugverkauf',v.bw-p,'loss');toast(`Verkauft für ${eur(p)}.`);break}
    case'hire':{const d=S.cands[+arg];if(!d)return;S.cands.splice(+arg,1);S.drv.push(d);addOne(`Stelleninserat ${d.name}`,350,'other');toast(`${d.name} ist jetzt in deinem Team.`);break}
    case'fire':{if(!confirmTwice(el,'Wirklich kündigen?'))return;const d=S.drv.find(x=>x.id===+arg);if(!d)return;S.drv=S.drv.filter(x=>x!==d);addOne(`Kündigungsfrist ${d.name}`,d.wage*(1+LNK),'other');toast(`${d.name} wurde gekündigt.`);break}
    case'train':{const d=S.drv.find(x=>x.id===+arg);if(!d)return;const nx=d.lic+1;d.train=nx;addOne(`Ausbildung ${LIC[nx]} ${d.name}`,TRAIN[nx].cost,'other');toast(`${d.name} macht die Ausbildung. Ab nächstem Monat gilt der neue Führerschein.`);break}
    case'depot':{if(!confirmTwice(el,'Wirklich umziehen?'))return;S.depotBig=true;addOne('Umzug in größeres Depot',3000,'other');toast('Ihr zieht in ein größeres Depot.');break}
    case'loan':{const a=+$('loanAmt').value;if(!a)return;S.loans.push({amt:a,left:a,rate:a/36});addOne('Kreditauszahlung',a,'loanIn');toast(`Kredit über ${eur(a)} aufgenommen.`);break}
    case'repay':{if(!confirmTwice(el,'Wirklich alles zurückzahlen?'))return;const d=S.loans.reduce((a,l)=>a+l.left,0);addOne('Sondertilgung Kredit',d,'tilg');S.loans=[];toast('Kredit zurückgezahlt.');break}
    case'saveAnswers':{document.querySelectorAll('[data-answer]').forEach(t=>{const v=t.value.trim();if(v)S.tasks[t.dataset.answer].a=v});toast('Antworten gespeichert.');break}
  }
  save();render();
}
function confirmTwice(el,msg){if(el.dataset.arm&&Date.now()-el.dataset.arm<3500)return true;el.dataset.arm=Date.now();el.dataset.old=el.textContent;el.textContent=msg+' Nochmal tippen';setTimeout(()=>{if(el.isConnected&&el.dataset.old){el.textContent=el.dataset.old;delete el.dataset.arm}},3500);return false}

   <div class="panel"><h2>${adv()?T('guv','Erfolgsrechnung'):'Einnahmen und Ausgaben'}</h2><div class="tablewrap">${finRows(r)}</div>
    ${adv()&&(r.purchases||r.loanIn||r.tilg||r.sales||r.cost.afa)?`<p class="sub">Unterschied zum Konto: Fahrzeugkäufe ${eur(r.purchases)}, Verkäufe ${eur(r.sales)}, Kreditauszahlung ${eur(r.loanIn)}, Tilgung ${eur(r.tilg)}. Die ${T('afa','Abschreibung')} von ${eur(r.cost.afa)} kostet kein Geld vom Konto.</p>`:''}</div>
   ${yearEnd?`<div class="event"><div class="k">Jahresabschluss ${2027+Math.floor(r.m/12)}</div><div class="t">Jahresergebnis: ${eur(r.yearProfit)}</div><p>${r.tax?`Darauf zahlst du 23 % ${T('koest','Körperschaftsteuer')}: <b>${eur(r.tax)}</b>.`:`Kein Gewinn, daher keine ${T('koest','Körperschaftsteuer')}.`}</p></div>`:''}
   <div class="task"><b>Arbeitsauftrag</b><p>${esc(r.task)}</p><textarea id="taskA" placeholder="Deine Antwort (du kannst sie auch später in der Übersicht eintragen)"></textarea></div>
   ${bust?`<div class="warnbox">Dein Unternehmen ist zahlungsunfähig. Das Planspiel ist beendet. Exportiere deinen Abschlussbericht.</div>`:''}
   <div class="actions">${bust||yearEnd?`<button class="primary" data-act2="final" type="button">Abschlussbericht ansehen</button>`:''}${bust?'':`<button class="${yearEnd?'':'primary'}" data-act2="next" type="button">Weiter zu ${monthName(r.m+1)}</button>`}</div>`);
}
function takeAnswer(){const t=$('taskA');if(t&&t.value.trim()&&lastReport){S.tasks[lastReport.m].a=t.value.trim();save()}}
function reportText(){
  const h=S.history,b=balance(),tot=sumReports(h);
  const L=[];L.push('PAKETDIENST-PLANSPIEL · ABSCHLUSSBERICHT','');
  L.push(`Name: ${S.name}`,`Klasse: ${S.klasse||'-'}`,`Firma: ${S.firma}`,`Stufe: ${adv()?'Fortgeschritten':'Einsteiger'}`,`Gespielte Monate: ${h.length}${S.ended==='insolvent'?' (Insolvenz)':''}`,`Erstellt: ${new Date().toLocaleString('de-AT')}`,'');
  L.push('ERGEBNIS',`Kontostand: ${eur(S.cash)} (Start ${eur(START_CAPITAL)})`,`Umsatz gesamt: ${eur(tot.revTotal)}`,`Kosten gesamt: ${eur(tot.costTotal)}`,`Ergebnis gesamt vor Steuern: ${eur(tot.profit)}`,`Bezahlte Körperschaftsteuer: ${eur(h.reduce((a,x)=>a+(x.tax||0),0))}`,`Ruf: ${S.ruf} / 100`,`Fuhrpark: ${S.veh.length} Fahrzeuge · Team: ${S.drv.length} Fahrer:innen`);
  if(adv())L.push(`Eigenkapital: ${eur(b.ek)} · Fremdkapital: ${eur(b.loans+b.od)}`,`Umsatzrendite gesamt: ${tot.revTotal?pct(tot.profit/tot.revTotal):'-'}`);
  L.push('','MONATE','Monat | Umsatz | Kosten | Ergebnis | Konto | Auslastung');
  h.forEach(r=>L.push(`${monthName(r.m)} | ${eur(r.revTotal)} | ${eur(r.costTotal)} | ${eur(r.profit)} | ${eur(r.cash)} | ${pct(r.util)}`));
  L.push('','ARBEITSAUFTRÄGE');
  Object.entries(S.tasks).forEach(([k,t])=>{L.push('',`${monthName(+k)}: ${t.q}`,`Antwort: ${t.a||'(keine Antwort)'}`)});
  return L.join('\n');
}
function finalSheet(){
  const txt=reportText(),h=S.history,tot=sumReports(h);
  openSheet(`<button class="small x" data-close type="button">Schließen</button><span class="chip gold" style="align-self:flex-start">Abschlussbericht</span><h2>${esc(S.firma)}</h2>
    <div class="tiles"><div class="tile"><div class="l">Kontostand</div><div class="v ${S.cash<0?'neg':''}">${eur(S.cash)}</div><div class="d">Start ${eur(START_CAPITAL)}</div></div><div class="tile"><div class="l">Ergebnis gesamt</div><div class="v ${tot.profit<0?'neg':'pos'}">${eur(tot.profit)}</div><div class="d">${h.length} Monate</div></div><div class="tile"><div class="l">Ruf</div><div class="v">${S.ruf}</div></div></div>
    ${h.length?`<div class="panel"><h2>Ergebnis je Monat</h2>${barChart(h.map(x=>x.profit),h.map(x=>MONTHS[x.m%12].slice(0,3)))}</div>`:''}
    <p class="sub">Gib diesen Bericht bei deiner Lehrkraft ab: Text kopieren und zum Beispiel in Teams, Moodle oder eine E-Mail einfügen, oder als Datei speichern.</p>
    <textarea id="repTxt" class="codebox" readonly style="min-height:200px"></textarea>
    <div class="actions"><button class="primary small" id="copyRep" type="button">Bericht kopieren</button><button class="small" id="dlRep" type="button" ${DL?'':'hidden'}>Als Datei speichern</button>${S.ended?'<button class="small" data-act2="restart" type="button">Neues Planspiel</button>':''}</div><p class="sub" id="repMsg" aria-live="polite"></p>`);
  $('repTxt').value=txt;
  $('copyRep').onclick=()=>copyText(txt,$('repTxt'),$('repMsg'));
  $('dlRep').onclick=async()=>{try{await DL.save({filename:`planspiel-${(S.name||'bericht').replace(/[^\wäöüÄÖÜß-]+/g,'-')}.txt`,data:txt});$('repMsg').textContent='Datei gespeichert.'}catch(e){$('repMsg').textContent='Speichern ging nicht. Kopiere stattdessen den Text.'}};
}
function copyText(txt,ta,msgEl){const sel=()=>{ta.focus();ta.select();msgEl.textContent='Text markiert. Jetzt kopieren.'};try{navigator.clipboard.writeText(txt).then(()=>msgEl.textContent='Kopiert!',sel)}catch(e){sel()}}
function lexSheet(focus){
  const list=Object.entries(TERMS).filter(([k,t])=>!t[3]||adv()||focus===k).sort((a,b)=>a[1][0].localeCompare(b[1][0],'de'));
  openSheet(`<button class="small x" data-close type="button">Schließen</button><span class="chip info" style="align-self:flex-start">Lexikon</span><h2>Wirtschaftsbegriffe</h2><dl class="lex">${list.map(([k,t])=>`<dt id="lx-${k}" class="${k===focus?'hl':''}">${t[0]}</dt><dd>${t[1]}${t[2]?`<span class="ex">${t[2]}</span>`:''}</dd>`).join('')}</dl>`);
  if(focus){const el=$('lx-'+focus);el&&el.scrollIntoView({block:'center'})}
}
function termSheet(k){const t=TERMS[k];openSheet(`<button class="small x" data-close type="button">Schließen</button><span class="chip info" style="align-self:flex-start">Lexikon</span><h2>${t[0]}</h2><p>${t[1]}</p>${t[2]?`<p class="sub">${t[2]}</p>`:''}<div class="actions"><button class="small" data-act2="lexall" data-k="${k}" type="button">Alle Begriffe</button></div>`,true)}
function teacherSheet(){
  openSheet(`<button class="small x" data-close type="button">Schließen</button><span class="chip info" style="align-self:flex-start">Für Lehrkräfte</span><h2>Hinweise zum Planspiel</h2>
  <p><b>Idee:</b> Die Schülerinnen und Schüler führen einen kleinen Paketdienst in Wien ein Geschäftsjahr lang. Jede Runde ist ein Monat: Sie nehmen Aufträge an, setzen einen Preis, leasen oder kaufen Fahrzeuge, stellen Personal ein und schließen den Monat ab. Danach lesen sie den Monatsbericht und beantworten einen Arbeitsauftrag.</p>
  <p><b>Stufen:</b> <i>Einsteiger</i> (Unterstufe): Einnahmen, Ausgaben, Gewinn, Löhne, Leasing, Überziehung. <i>Fortgeschritten</i> (Oberstufe, HAK, HAS): zusätzlich Kauf mit Abschreibung, Kredit, Erfolgsrechnung, Bilanz, Deckungsbeitrag, Break-even, Bonität, Fernverkehr mit Maut, Kennzahlen.</p>
  <p><b>Zeitbedarf:</b> etwa 3 bis 5 Minuten pro Monat, ein Geschäftsjahr in rund zwei Unterrichtseinheiten. Das Spiel lässt sich jederzeit unterbrechen.</p>
  <p><b>Lernziele:</b> Fixkosten und variable Kosten unterscheiden · Preis und Nachfrage verstehen · Gewinn und Liquidität unterscheiden · Lohnnebenkosten und 13./14. Gehalt kennen · Kaufen, Leasen und Kredit vergleichen · Risiko und Auslastung bewerten.</p>
  <p><b>Ergebnisse einsammeln:</b> Unter „Speichern“ bzw. im Abschlussbericht kopieren die Schüler:innen einen Bericht mit allen Monatszahlen und ihren Antworten auf die Arbeitsaufträge und geben ihn ab, zum Beispiel über Teams oder Moodle.</p>
  <p><b>Speichern:</b> Der Spielstand liegt im Browser des jeweiligen Geräts. Auf Schul-iPads oder bei gelöschten Browserdaten kann er verloren gehen. Darum gibt es unter „Speichern“ einen Sicherungscode zum Weiterspielen.</p>
  <p><b>Diskussionsfragen:</b> Warum macht das Unternehmen trotz voller Auftragsbücher Verlust? Lohnt sich ein E-Fahrzeug? Warum zahlen Unternehmen lieber Leasing als den vollen Kaufpreis? Was passiert, wenn eine Fahrerin krank wird?</p>
  <p class="sub"><b>Wichtig:</b> Alle Werte sind vereinfachte Annahmen, angelehnt an österreichische Verhältnisse 2026 (Diesel ${eurC(PRICE.diesel)}/l netto, Lohnnebenkosten rund 29 %, Körperschaftsteuer 23 %, Löhne angelehnt an den Kollektivvertrag für das Güterbeförderungsgewerbe). Sie eignen sich für den Unterricht, nicht als Planungsgrundlage. Firmen und Kundennamen sind frei erfunden.</p>`);
}
let DL=null;
async function saveSheet(){
  const code=await encodeSave();
  openSheet(`<button class="small x" data-close type="button">Schließen</button><span class="chip info" style="align-self:flex-start">Speichern</span><h2>Spielstand sichern</h2>
   <p class="sub">Das Planspiel speichert automatisch in diesem Browser. Auf manchen Geräten (vor allem iPhone und iPad) können diese Daten verloren gehen. Kopiere dir deshalb den Code, dann kannst du jederzeit und auf jedem Gerät weiterspielen.</p>
   <label class="f" for="codeOut">Dein Sicherungscode · ${monthName()}</label><textarea id="codeOut" class="codebox" readonly></textarea>
   <div class="actions"><button class="primary small" id="copyCode" type="button">Code kopieren</button><button class="small" id="dlCode" type="button" ${DL?'':'hidden'}>Als Datei speichern</button><button class="small" data-act2="final" type="button">Abschlussbericht</button></div>
   <label class="f" for="codeIn">Spielstand laden</label><textarea id="codeIn" class="codebox" placeholder="Sicherungscode hier einfügen"></textarea>
   <div class="actions"><button class="primary small" id="loadCode" type="button">Laden</button><button class="small" data-act2="restart" type="button">Neues Planspiel</button></div><p class="sub" id="ioMsg" aria-live="polite"></p>`);
  $('codeOut').value=code;
  $('copyCode').onclick=()=>copyText(code,$('codeOut'),$('ioMsg'));
  $('dlCode').onclick=async()=>{try{await DL.save({filename:`planspiel-spielstand-${monthName().replace(' ','-')}.txt`,data:code});$('ioMsg').textContent='Datei gespeichert.'}catch(e){$('ioMsg').textContent='Speichern ging nicht. Kopiere stattdessen den Code.'}};
  let pend=null,arm=0;
  $('loadCode').onclick=async()=>{if(pend&&Date.now()-arm<6000){S=pend;tab='over';save();closeSheet();render();toast('Spielstand geladen.');return}
    try{pend=await decodeSave($('codeIn').value);arm=Date.now();$('loadCode').textContent='Wirklich laden? Nochmal tippen';$('ioMsg').textContent=`Gefunden: ${pend.firma}, ${monthName(pend.m)}. Dein aktueller Spielstand wird ersetzt.`}catch(e){$('ioMsg').textContent='Das ist kein gültiger Sicherungscode.'}};
}
async function encodeSave(){const json=JSON.stringify(S);try{if(window.CompressionStream){const st=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));const u=new Uint8Array(await new Response(st).arrayBuffer());let b='';for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return'PSZ1'+btoa(b)}}catch(e){}return'PSJ1'+btoa(unescape(encodeURIComponent(json)))}
async function decodeSave(code){code=(code||'').trim().replace(/\s+/g,'');let json;
  if(code.startsWith('PSZ1')){const bin=atob(code.slice(4)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);json=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
  else if(code.startsWith('PSJ1'))json=decodeURIComponent(escape(atob(code.slice(4))));else throw new Error('format');
  const st=JSON.parse(json);if(!st||st.v!==1||!Array.isArray(st.veh))throw new Error('format');return st}
function startSheet(pre){
  pre=pre||{};$('sheet').dataset.lock='1';
  openSheet(`<span class="chip gold" style="align-self:flex-start">Planspiel</span><h2>Gründe deinen Paketdienst</h2>
   <p>Du übernimmst ein kleines Zustellunternehmen in Wien. Dein Ziel: ein Geschäftsjahr lang wirtschaften, ohne pleitezugehen, und am Ende möglichst viel Gewinn und einen guten Ruf haben.</p>
   <label class="f" for="stName">Dein Name<input type="text" id="stName" autocomplete="name" maxlength="40" value="${esc(pre.name||'')}"></label>
   <label class="f" for="stKl">Klasse<input type="text" id="stKl" maxlength="12" placeholder="z. B. 3B" value="${esc(pre.klasse||'')}"></label>
   <label class="f" for="stFirma">Name deiner Firma<input type="text" id="stFirma" maxlength="40" placeholder="z. B. Blitzpaket GmbH" value="${esc(pre.firma||'')}"></label>
   <div class="lvl"><label><input type="radio" name="lvl" value="basic" ${pre.lvl!=='adv'?'checked':''}><div><b>Einsteiger</b><span>Unterstufe: Einnahmen, Ausgaben, Gewinn, Löhne, Leasing.</span></div></label>
   <label><input type="radio" name="lvl" value="adv" ${pre.lvl==='adv'?'checked':''}><div><b>Fortgeschritten</b><span>Oberstufe, HAK, HAS: Kauf und Abschreibung, Kredit, Erfolgsrechnung, Bilanz, Kennzahlen.</span></div></label></div>
   <p class="sub" id="stMsg"></p>
   <div class="actions"><button class="primary" id="stGo" type="button">Planspiel starten</button><button class="small" data-act2="loadFromStart" type="button">Spielstand laden</button><button class="small" data-open="teacher" type="button">Für Lehrkräfte</button></div>`);
  $('stGo').onclick=()=>{const n=$('stName').value.trim(),f=$('stFirma').value.trim()||'Mein Paketdienst GmbH';if(!n){$('stMsg').textContent='Bitte gib deinen Namen ein.';$('stName').focus();return}
    newGame({name:n,klasse:$('stKl').value.trim(),firma:f,lvl:document.querySelector('input[name=lvl]:checked').value});delete $('sheet').dataset.lock;closeSheet();tab='over';render()};
}

/* ================= Events ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-tab],[data-term],[data-open],[data-choose],[data-accept],[data-lease],[data-buy],[data-ret],[data-sell],[data-hire],[data-fire],[data-train],[data-act],[data-act2],[data-close]');if(!el)return;const d=el.dataset;
  if(d.tab)return setTab(d.tab);
  if(d.term){e.preventDefault();return termSheet(d.term)}
  if(d.open==='lex')return lexSheet();if(d.open==='teacher')return teacherSheet();if(d.open==='save')return S?saveSheet():null;
  if(d.close!==undefined)return closeSheet();
  if(d.choose)return choose(d.choose);
  for(const k of ['accept','lease','buy','ret','sell','hire','fire','train'])if(d[k]!=null)return act(k,d[k],el);
  if(d.act)return act(d.act,null,el);
  if(d.act2==='next'){takeAnswer();delete $('sheet').dataset.lock;closeSheet();tab='over';render();return}
  if(d.act2==='final'){takeAnswer();delete $('sheet').dataset.lock;return finalSheet()}
  if(d.act2==='lexall')return lexSheet(d.k);
  if(d.act2==='restart'){if(!confirmTwice(el,'Alles neu?'))return;restart();return}
  if(d.act2==='loadFromStart'){saveSheetLoadOnly();return}
});
function restart(){const pre=S?{name:S.name,klasse:S.klasse,firma:S.firma,lvl:S.lvl}:{};try{localStorage.removeItem(SAVE)}catch(_){}S=null;tab='over';$('view').innerHTML='';startSheet(pre)}
$('restartBtn').onclick=e=>{if(!S)return;if(!confirmTwice(e.currentTarget,'Spielstand löschen?'))return;restart();toast('Neues Planspiel. Deine Angaben sind schon eingetragen.')};
function saveSheetLoadOnly(){
  openSheet(`<span class="chip info" style="align-self:flex-start">Spielstand laden</span><h2>Mit Sicherungscode weiterspielen</h2><textarea id="codeIn" class="codebox" placeholder="Sicherungscode hier einfügen"></textarea><div class="actions"><button class="primary small" id="loadCode" type="button">Laden</button><button class="small" id="backStart" type="button">Zurück</button></div><p class="sub" id="ioMsg"></p>`,true);
  $('sheet').dataset.lock='1';
  $('backStart').onclick=()=>{S=null;delete $('sheet').dataset.lock;startSheet()};
  $('loadCode').onclick=async()=>{try{S=await decodeSave($('codeIn').value);save();delete $('sheet').dataset.lock;closeSheet();tab='over';render();toast('Spielstand geladen.')}catch(e){$('ioMsg').textContent='Das ist kein gültiger Sicherungscode.'}};
}
document.addEventListener('input',e=>{
  if(!S)return;
  if(e.target.id==='spotPrice'){S.spotPrice=+e.target.value;$('spotOut').textContent=eurC(S.spotPrice);const r=simulate(true);$('spotTiles').innerHTML=spotTiles(r);renderPreview();save()}
  if(e.target.id==='mkt'){S.marketing=+e.target.value;$('mktOut').textContent=eur(S.marketing);const r=simulate(true);$('spotTiles').innerHTML=spotTiles(r);renderPreview();save()}
});
document.addEventListener('change',e=>{if(S&&e.target.id==='ot'){S.overtime=e.target.checked;save();renderPreview()}});
$('closeMonth').onclick=closeMonth;
const tip=$('tip');
document.addEventListener('pointerover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.hidden=true;return}tip.textContent=t.dataset.tip;tip.hidden=false;const r=t.getBoundingClientRect();tip.style.left=(r.left+r.width/2)+'px';tip.style.top=(r.top)+'px'});
let toastT=0;function toast(m){const el=$('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),3200)}
function save(){try{if(S&&S.veh&&S.name)localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}

/* ================= Start ================= */
DL={save:async({filename,data})=>{const b=new Blob([data],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);return{status:'saved'}}};
try{const raw=localStorage.getItem(SAVE);if(raw){const st=JSON.parse(raw);if(st&&st.v===1&&st.name)S=st}}catch(e){}
if(S){render();if(S.ended)finalSheet()}else startSheet();
})();
</script>
</body>
</html>
